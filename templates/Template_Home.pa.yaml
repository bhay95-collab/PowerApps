Screens:
  TemplateHome:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// demo numbers: replace with real counts (work ratios out once, never divide by a blank)
        Set(varTotal_Hom, 10);
        Set(varDone_Hom, 4);
        Set(varPct_Hom, If(varTotal_Hom > 0, varDone_Hom / varTotal_Hom, 0))
    Children:
      - conRoot_Hom:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Hom:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(165 * UI, 0)
                  LayoutMinHeight: =Round(165 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Hom:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - lblKicker_Hom:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(23 * UI, 0)
                        Size: =Round(11 * UI, 0)
                        Text: ="STARS PHYSIOTHERAPY"
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(33 * UI, 0)
                  - lblTitle_Hom:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(70 * UI, 0)
                        Size: =Round(28 * UI, 0)
                        Text: ="App Title"
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(45 * UI, 0)
                  - lblHello_Hom:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.9)
                        Font: =AppFont
                        Height: =Round(28 * UI, 0)
                        Size: =Round(13 * UI, 0)
                        Text: |-
                          ="Hi " & With({ n: User().FullName }, If("," in n, Trim(Last(Split(n, ",")).Value), First(Split(n, " ")).Value)) & "  ·  " & Text(Today(), "dddd d mmmm")
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(110 * UI, 0)
            - conBody_Hom:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
