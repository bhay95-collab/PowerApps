                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 0.16)
                              Height: =Round(56 * UI, 0)
                              RadiusBottomLeft: =Round(28 * UI, 0)
                              RadiusBottomRight: =Round(28 * UI, 0)
                              RadiusTopLeft: =Round(28 * UI, 0)
                              RadiusTopRight: =Round(28 * UI, 0)
                              Width: =Round(56 * UI, 0)
