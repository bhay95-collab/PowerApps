                        - conBarBg_Hom:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =C_Line
                              Height: =Round(8 * UI, 0)
                              RadiusBottomLeft: =Round(4 * UI, 0)
                              RadiusBottomRight: =Round(4 * UI, 0)
                              RadiusTopLeft: =Round(4 * UI, 0)
                              RadiusTopRight: =Round(4 * UI, 0)
                              Width: =Parent.Width - Round(40 * UI, 0)
