Screens:
  TemplateList:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// demo rows: replace with ClearCollect(colRows_Lst, <your list / filter>)
        ClearCollect(
            colRows_Lst,
            { Title: "First item", Detail: "Location", Group: "Alpha", NeedsAction: true },
            { Title: "Second item", Detail: "Location", Group: "Beta", NeedsAction: false },
            { Title: "Third item", Detail: "Location", Group: "Alpha", NeedsAction: false }
        );
        // pills: one per group + All (labels kept short so they fit one row)
        ClearCollect(colPills_Lst, ForAll(Distinct(colRows_Lst, Group) As g, { Label: g.Value, Key: g.Value }));
        Collect(colPills_Lst, { Label: "All", Key: "ALL" });
        Set(varPick_Lst, "ALL");
        Reset(txtSearch_Lst)
    Children:
      - conRoot_Lst:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Lst:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Lst:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Lst:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =Navigate(TemplateHome, ScreenTransition.UnCoverRight)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(24 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Lst:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(42 * UI, 0)
                        Size: =Round(19 * UI, 0)
                        Text: ="List Title"
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(12 * UI, 0)
                  - lblHdrS_Lst:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Font: =AppFont
                        Height: =Round(25 * UI, 0)
                        Size: =Round(12 * UI, 0)
                        Text: ="Subtitle or step"
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(53 * UI, 0)
            - conBody_Lst:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =Round(12 * UI, 0)
                  LayoutMinHeight: =Round(250 * UI, 0)
                  PaddingBottom: =Round(10 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingTop: =Round(15 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conSearch_Lst:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(14, 42, 70, 0.22)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(60 * UI, 0)
                        LayoutMinHeight: =Round(60 * UI, 0)
                        RadiusBottomLeft: =Round(15 * UI, 0)
                        RadiusBottomRight: =Round(15 * UI, 0)
                        RadiusTopLeft: =Round(15 * UI, 0)
                        RadiusTopRight: =Round(15 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - icoSearch_Lst:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(24 * UI, 0)
                              Icon: ="Search"
                              IconColor: =C_Muted
                              Width: =Round(24 * UI, 0)
                              X: =Round(16 * UI, 0)
                              Y: =Round(18 * UI, 0)
                        - txtSearch_Lst:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =C_Ink
                              Default: =""
                              DelayOutput: =true
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =AppFont
                              Height: =Parent.Height
                              HintText: ="Search"
                              Size: =Round(13 * UI, 0)
                              Width: =Parent.Width - Round(54 * UI, 0)
                              X: =Round(46 * UI, 0)
                  - galPills_Lst:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =Round(52 * UI, 0)
                        Items: =colPills_Lst
                        LayoutMinHeight: =Round(52 * UI, 0)
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =(PageW - Round(40 * UI, 0)) / Max(1, CountRows(colPills_Lst))
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conPill_Lst:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(ThisItem.Key = Coalesce(varPick_Lst, "ALL"), C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(ThisItem.Key = Coalesce(varPick_Lst, "ALL"), C_Accent, C_White)
                              Height: =Round(48 * UI, 0)
                              RadiusBottomLeft: =Round(24 * UI, 0)
                              RadiusBottomRight: =Round(24 * UI, 0)
                              RadiusTopLeft: =Round(24 * UI, 0)
                              RadiusTopRight: =Round(24 * UI, 0)
                              Width: =Parent.TemplateWidth - Round(6 * UI, 0)
                              X: =3
                              Y: =Round(2 * UI, 0)
                            Children:
                              - lblPill_Lst:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =If(ThisItem.Key = Coalesce(varPick_Lst, "ALL"), C_White, C_Ink2)
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(48 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =ThisItem.Label
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width - Round(8 * UI, 0)
                                    Wrap: =false
                                    X: =Round(4 * UI, 0)
                              - btnPill_Lst:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: =Set(varPick_Lst, ThisItem.Key)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                  - lblCount_Lst:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Color: =C_Muted
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(22 * UI, 0)
                        LayoutMinHeight: =Round(22 * UI, 0)
                        Size: =Round(11 * UI, 0)
                        Text: =CountRows(galRows_Lst.AllItems) & If(CountRows(galRows_Lst.AllItems) = 1, " item", " items")
                        Width: =PageW - Round(40 * UI, 0)
                        Wrap: =false
                  - lblEmpty_Lst:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Color: =C_Muted
                        Font: =AppFont
                        Height: =Round(50 * UI, 0)
                        LayoutMinHeight: =Round(50 * UI, 0)
                        Size: =Round(12 * UI, 0)
                        Text: =If(!IsBlank(Trim(txtSearch_Lst.Text)), "Nothing matches your search", "Nothing to show")
                        Visible: =CountRows(galRows_Lst.AllItems) = 0
                        Width: =PageW - Round(40 * UI, 0)
                        Wrap: =false
                  - galRows_Lst:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Items: |-
                          =SortByColumns(
                              Filter(
                                  colRows_Lst,
                                  (Coalesce(varPick_Lst, "ALL") = "ALL" || Group = varPick_Lst)
                                  && (
                                      IsBlank(Trim(txtSearch_Lst.Text))
                                      || Lower(Trim(txtSearch_Lst.Text)) in Lower(Title)
                                      || Lower(Trim(txtSearch_Lst.Text)) in Lower(Detail)
                                  )
                              ),
                              "Title",
                              SortOrder.Ascending
                          )
                        LayoutMinHeight: =Round(150 * UI, 0)
                        TemplatePadding: =0
                        TemplateSize: =Round(94 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conRow_Lst:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =C_Line
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =C_White
                              Height: =Round(84 * UI, 0)
                              RadiusBottomLeft: =Round(18 * UI, 0)
                              RadiusBottomRight: =Round(18 * UI, 0)
                              RadiusTopLeft: =Round(18 * UI, 0)
                              RadiusTopRight: =Round(18 * UI, 0)
                              Width: =Parent.TemplateWidth - Round(10 * UI, 0)
                              X: =1
                              Y: =Round(5 * UI, 0)
                            Children:
                              - conBar_Lst:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.NeedsAction, RGBA(176, 52, 40, 1), RGBA(30, 122, 80, 1))
                                    Height: =Parent.Height
                                    RadiusBottomLeft: =Round(18 * UI, 0)
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =Round(18 * UI, 0)
                                    RadiusTopRight: =0
                                    Width: =Round(8 * UI, 0)
                              - lblRowT_Lst:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(24 * UI, 0)
                                    Size: =Round(14 * UI, 0)
                                    Text: =ThisItem.Title
                                    Width: =Parent.Width - Round(62 * UI, 0)
                                    Wrap: =false
                                    X: =Round(22 * UI, 0)
                                    Y: =Round(10 * UI, 0)
                              - lblRowS_Lst:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =ThisItem.Detail & "  ·  " & ThisItem.Group
                                    Width: =Parent.Width - Round(62 * UI, 0)
                                    Wrap: =false
                                    X: =Round(22 * UI, 0)
                                    Y: =Round(35 * UI, 0)
                              - lblRowM_Lst:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(ThisItem.NeedsAction, RGBA(176, 52, 40, 1), RGBA(30, 122, 80, 1))
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =If(ThisItem.NeedsAction, "Needs action", "All clear")
                                    Width: =Parent.Width - Round(62 * UI, 0)
                                    Wrap: =false
                                    X: =Round(22 * UI, 0)
                                    Y: =Round(56 * UI, 0)
                              - icoGo_Lst:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(24 * UI, 0)
                                    Icon: ="ChevronRight"
                                    IconColor: =C_Muted
                                    Width: =Round(24 * UI, 0)
                                    X: =Parent.Width - Round(36 * UI, 0)
                                    Y: =Round(30 * UI, 0)
                              - btnRow_Lst:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varRow, ThisItem);
                                      Navigate(TemplateForm, ScreenTransition.Cover)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
