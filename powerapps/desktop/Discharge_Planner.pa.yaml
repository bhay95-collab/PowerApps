Screens:
  Discharge_Planner:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// Discharge planner. Loads every ward + the equipment that is out, Select(btnBuild_Dp) builds the board.
        Set(dpWard, "All");
        Set(dpMine, false);
        Set(dpNeed, false);
        Set(dpQ, "");
        Set(dpKpi, {Over: 0, Next2: 0, Week: 0, Equip: 0, NoEDD: 0, Aroc: 0, Later: 0});
        // Month View pop-up (heat map)
        Set(dpShowCal, false);
        Set(dpCalMonth, Date(Year(Today()), Month(Today()), 1));
        Set(dpCalSel, Today());
        Set(dpCalMax, 4);
        Select(btnLoad_Dp)
    Children:
      - btnLoad_Dp:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =Set(dpLoading, true);
              ClearCollect(colDpW, ForAll(
                      Ward_4A_Shared As w,
                      {
                          ID: w.ID, Ward: "4A", Patient: Trim(Coalesce(w.Patient, "")), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          EDD: w.EDD, Aroc: w.'AROC EDD', Admit: w.'Admission Date',
                          Falls: Coalesce(w.'Falls Risk', false), NDIS: Coalesce(w.NDIS, false), Maint: Coalesce(w.Maintenance, false), Link: Coalesce(w.'Link Worker', false),
                          Phys: Coalesce(First(w.PT_Users).DisplayName, ""),
                          Mine: !IsBlank(LookUp(w.PT_Users, Lower(Email) = Lower(User().Email))) || !IsBlank(LookUp(w.OT_Users, Lower(Email) = Lower(User().Email))) || !IsBlank(LookUp(w.SP_Users, Lower(Email) = Lower(User().Email)))
                      }
                  ));
              Collect(colDpW, ForAll(
                      Ward_4B_Shared As w,
                      {
                          ID: w.ID, Ward: "4B", Patient: Trim(Coalesce(w.Patient, "")), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          EDD: w.EDD, Aroc: w.'AROC EDD', Admit: w.'Admission Date',
                          Falls: Coalesce(w.'Falls Risk', false), NDIS: Coalesce(w.NDIS, false), Maint: Coalesce(w.Maintenance, false), Link: Coalesce(w.'Link Worker', false),
                          Phys: Coalesce(First(w.PT_Users).DisplayName, ""),
                          Mine: !IsBlank(LookUp(w.PT_Users, Lower(Email) = Lower(User().Email))) || !IsBlank(LookUp(w.OT_Users, Lower(Email) = Lower(User().Email))) || !IsBlank(LookUp(w.SP_Users, Lower(Email) = Lower(User().Email)))
                      }
                  ));
              Collect(colDpW, ForAll(
                      Ward_5A_Shared As w,
                      {
                          ID: w.ID, Ward: "5A", Patient: Trim(Coalesce(w.Patient, "")), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          EDD: w.EDD, Aroc: w.'AROC EDD', Admit: w.'Admission Date',
                          Falls: Coalesce(w.'Falls Risk', false), NDIS: Coalesce(w.NDIS, false), Maint: Coalesce(w.Maintenance, false), Link: Coalesce(w.'Link Worker', false),
                          Phys: Coalesce(First(w.PT_Users).DisplayName, ""),
                          Mine: !IsBlank(LookUp(w.PT_Users, Lower(Email) = Lower(User().Email))) || !IsBlank(LookUp(w.OT_Users, Lower(Email) = Lower(User().Email))) || !IsBlank(LookUp(w.SP_Users, Lower(Email) = Lower(User().Email)))
                      }
                  ));
              Collect(colDpW, ForAll(
                      Ward_6A_Shared As w,
                      {
                          ID: w.ID, Ward: "6A", Patient: Trim(Coalesce(w.Patient, "")), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          EDD: w.EDD, Aroc: w.'AROC EDD', Admit: w.'Admission Date',
                          Falls: Coalesce(w.'Falls Risk', false), NDIS: Coalesce(w.NDIS, false), Maint: Coalesce(w.Maintenance, false), Link: Coalesce(w.'Link Worker', false),
                          Phys: Coalesce(First(w.PT_Users).DisplayName, ""),
                          Mine: !IsBlank(LookUp(w.PT_Users, Lower(Email) = Lower(User().Email))) || !IsBlank(LookUp(w.OT_Users, Lower(Email) = Lower(User().Email))) || !IsBlank(LookUp(w.SP_Users, Lower(Email) = Lower(User().Email)))
                      }
                  ));
              RemoveIf(colDpW, IsBlank(Patient));
              // equipment that is out, matched to patients by URN
              ClearCollect(
                  colDpInv,
                  AddColumns(
                      Filter(Equipment_Inventory_SharePoint, Status.Value = "Allocated"),
                      iUrn, Trim(Coalesce(URN, ""))
                  )
              );
              Set(dpLoading, false);
              Select(btnBuild_Dp)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(14 * SF, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =10 * SX
      - btnBuild_Dp:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =// the next five working days (a weekend EDD sits in the Friday column)
              Set(dpD1, If(Weekday(Today(), StartOfWeek.Monday) > 5, DateAdd(Today(), 8 - Weekday(Today(), StartOfWeek.Monday), TimeUnit.Days), Today()));
              Set(dpD2, DateAdd(dpD1, If(Weekday(dpD1, StartOfWeek.Monday) = 5, 3, 1), TimeUnit.Days));
              Set(dpD3, DateAdd(dpD2, If(Weekday(dpD2, StartOfWeek.Monday) = 5, 3, 1), TimeUnit.Days));
              Set(dpD4, DateAdd(dpD3, If(Weekday(dpD3, StartOfWeek.Monday) = 5, 3, 1), TimeUnit.Days));
              Set(dpD5, DateAdd(dpD4, If(Weekday(dpD4, StartOfWeek.Monday) = 5, 3, 1), TimeUnit.Days));
              ClearCollect(
                  colDpDays,
                  Table(
                      { Idx: 1, Day: dpD1, From: Today(), To: DateAdd(dpD2, -1, TimeUnit.Days) },
                      { Idx: 2, Day: dpD2, From: dpD2, To: DateAdd(dpD3, -1, TimeUnit.Days) },
                      { Idx: 3, Day: dpD3, From: dpD3, To: DateAdd(dpD4, -1, TimeUnit.Days) },
                      { Idx: 4, Day: dpD4, From: dpD4, To: DateAdd(dpD5, -1, TimeUnit.Days) },
                      { Idx: 5, Day: dpD5, From: dpD5, To: DateAdd(dpD5, If(Weekday(dpD5, StartOfWeek.Monday) = 5, 2, 0), TimeUnit.Days) }
                  )
              );
              // patients that match the filters, with the equipment they have out
              ClearCollect(
                  colDpShow,
                  SortByColumns(
                      Filter(
                          AddColumns(
                              colDpW,
                              EquipN, If(UrnT = "", 0, CountRows(Filter(colDpInv, iUrn = UrnT))),
                              EquipList, If(UrnT = "", "", Concat(Filter(colDpInv, iUrn = UrnT), Title, ", ")),
                              Variance, If(IsBlank(Aroc) || IsBlank(EDD), 0, DateDiff(EDD, Aroc, TimeUnit.Days))
                          ),
                          (dpWard = "All" || Ward = dpWard) &&
                          (!dpMine || Mine) &&
                          (!dpNeed || EquipN > 0) &&
                          (dpQ = "" || dpQ in Lower(Patient) || dpQ in Lower(UrnT) || dpQ in Lower(Phys))
                      ),
                      "Ward", SortOrder.Ascending,
                      "BedT", SortOrder.Ascending
                  )
              );
              Set(
                  dpKpi,
                  {
                      Over: CountRows(Filter(colDpShow, !IsBlank(EDD) && EDD < Today())),
                      Next2: CountRows(Filter(colDpShow, !IsBlank(EDD) && EDD >= Today() && EDD <= LookUp(colDpDays, Idx = 2).To)),
                      Week: CountRows(Filter(colDpShow, !IsBlank(EDD) && EDD >= Today() && EDD <= LookUp(colDpDays, Idx = 5).To)),
                      Equip: Sum(Filter(colDpShow, !IsBlank(EDD) && EDD <= LookUp(colDpDays, Idx = 5).To), EquipN),
                      NoEDD: CountRows(Filter(colDpShow, IsBlank(EDD))),
                      Aroc: CountRows(Filter(colDpShow, Variance > 0)),
                      Later: CountRows(Filter(colDpShow, !IsBlank(EDD) && EDD > LookUp(colDpDays, Idx = 5).To))
                  }
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(14 * SF, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =10 * SX
      - btnCal_Dp:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            Appearance: =ButtonAppearance.Transparent
            BorderStyle: =BorderStyle.None
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =// Month View heat map: one cell per day, 6 weeks from the Monday on/before the 1st.
              // Counts patients in colDpShow (so the screen filters apply). Colour level 1-4 is scaled to the busiest day of the month (never less than 4).
              Set(dpCalStart, DateAdd(dpCalMonth, 1 - Weekday(dpCalMonth, StartOfWeek.Monday), TimeUnit.Days));
              ClearCollect(
                  colDpCalRaw,
                  ForAll(
                      Sequence(42, 0) As s,
                      With(
                          { d: DateAdd(dpCalStart, s.Value, TimeUnit.Days) },
                          {
                              Dt: d,
                              InMonth: Month(d) = Month(dpCalMonth),
                              N: CountRows(Filter(colDpShow, !IsBlank(EDD) && EDD >= d && EDD < DateAdd(d, 1, TimeUnit.Days)))
                          }
                      )
                  )
              );
              Set(dpCalMax, Max(4, Max(Filter(colDpCalRaw, InMonth), N)));
              ClearCollect(
                  colDpCal,
                  AddColumns(
                      colDpCalRaw,
                      Lvl, If(N = 0, 0, Min(4, RoundUp(N * 4 / dpCalMax, 0))),
                      Past, Dt < Today()
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(14 * SF, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =10 * SX
