Screens:
  Dashboard:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =If(IsBlank(varDashStream), Set(varDashStream, "ALL"));
        If(IsBlank(varDashPeriod), Set(varDashPeriod, "All"));
        If(IsBlank(varDashMine), Set(varDashMine, false));
        Set(varDashFKind, "");
        Set(varDashFVal, "");
        Set(varSaving, false);
        Set(varDashShowDet, false);
        Reset(txtSearch_Dsh);
        ClearCollect(colDashPills, { Label: "All", Full: "All Streams", Key: "ALL" });
        ForAll(StreamList As s, Collect(colDashPills, { Label: s.Short, Full: s.Key, Key: s.Key }));
        ClearCollect(colDashPer, { Label: "Today", Key: "Today" }, { Label: "7 Days", Key: "7" }, { Label: "30 Days", Key: "30" }, { Label: "All Time", Key: "All" });
        Select(btnLoad_Dsh)
    Children:
      - conRoot_Dsh:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Dsh:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Dsh:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Dsh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =Navigate(Home, ScreenTransition.UnCoverRight)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(24 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =DashX - Round(10 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Dsh:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(42 * UI, 0)
                        Size: =Round(19 * UI, 0)
                        Text: =If(varDashMine, "My Ideas", "Ideas Dashboard")
                        Width: =DashW - Round(55 * UI, 0) - If(DashWide, Round(190 * UI, 0), Round(70 * UI, 0))
                        Wrap: =false
                        X: =DashX + Round(55 * UI, 0)
                        Y: =Round(12 * UI, 0)
                  - lblHdrS_Dsh:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Font: =AppFont
                        Height: =Round(25 * UI, 0)
                        Size: =Round(12 * UI, 0)
                        Text: =If(varDashStream = "ALL", "All streams", varDashStream) & "  ·  " & Switch(varDashPeriod, "Today", "Today", "7", "Last 7 days", "30", "Last 30 days", "All time") & "  ·  " & varDashN & If(varDashN = 1, " idea", " ideas")
                        Width: =DashW - Round(55 * UI, 0) - If(DashWide, Round(190 * UI, 0), Round(70 * UI, 0))
                        Wrap: =false
                        X: =DashX + Round(55 * UI, 0)
                        Y: =Round(53 * UI, 0)
                  - conRefresh_Dsh:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(255, 255, 255, 0.45)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 0.16)
                        Height: =Round(50 * UI, 0)
                        RadiusBottomLeft: =Round(25 * UI, 0)
                        RadiusBottomRight: =Round(25 * UI, 0)
                        RadiusTopLeft: =Round(25 * UI, 0)
                        RadiusTopRight: =Round(25 * UI, 0)
                        Width: =If(DashWide, Round(170 * UI, 0), Round(56 * UI, 0))
                        X: =DashX + DashW - If(DashWide, Round(170 * UI, 0), Round(56 * UI, 0))
                        Y: =Round(22 * UI, 0)
                      Children:
                        - btnRefresh_Dsh:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Color: =C_White
                              DisplayMode: =If(varDashLoading, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Icon: ="ArrowClockwise"
                              OnSelect: =Select(btnLoad_Dsh)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: =If(DashWide, "Refresh", "")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
            - conBody_Dsh:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =DashGap
                  LayoutMinHeight: =Round(250 * UI, 0)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =Round(10 * UI, 0)
                  PaddingLeft: =DashX
                  PaddingRight: =DashX
                  PaddingTop: =Round(18 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conFilters_Dsh:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(134 * UI, 0)
                        LayoutMinHeight: =Round(134 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Width: =DashW
                      Children:
                        - galStr_Dsh:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              Height: =Round(52 * UI, 0)
                              Items: =colDashPills
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =(Parent.Width - Round(32 * UI, 0)) / Max(1, CountRows(colDashPills))
                              Width: =Parent.Width - Round(32 * UI, 0)
                              X: =Round(16 * UI, 0)
                              Y: =Round(12 * UI, 0)
                            Children:
                              - conStrP_Dsh:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =If(ThisItem.Key = varDashStream, C_Accent, C_Line)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Key = varDashStream, C_Accent, C_White)
                                    Height: =Round(48 * UI, 0)
                                    RadiusBottomLeft: =Round(24 * UI, 0)
                                    RadiusBottomRight: =Round(24 * UI, 0)
                                    RadiusTopLeft: =Round(24 * UI, 0)
                                    RadiusTopRight: =Round(24 * UI, 0)
                                    Width: =Parent.TemplateWidth - Round(6 * UI, 0)
                                    X: =3
                                    Y: =Round(2 * UI, 0)
                                  Children:
                                    - lblStrP_Dsh:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =If(ThisItem.Key = varDashStream, C_White, C_Ink2)
                                          Font: =AppFont
                                          FontWeight: =FontWeight.Bold
                                          Height: =Round(48 * UI, 0)
                                          Size: =Round(11 * UI, 0)
                                          Text: =If(DashWide, ThisItem.Full, ThisItem.Label)
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width - Round(8 * UI, 0)
                                          Wrap: =false
                                          X: =Round(4 * UI, 0)
                                    - btnStrP_Dsh:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Appearance: =ButtonAppearance.Transparent
                                          BorderStyle: =BorderStyle.None
                                          FontWeight: =""
                                          Height: =Parent.Height
                                          OnSelect: |-
                                            =Set(varDashStream, ThisItem.Key);
                                            Select(btnCalc_Dsh)
                                          PaddingBottom: =5
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =5
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Text: =""
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width
                        - galPer_Dsh:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              Height: =Round(52 * UI, 0)
                              Items: =colDashPer
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =(Parent.Width - Round(32 * UI, 0) - Round(110 * UI, 0)) / Max(1, CountRows(colDashPer))
                              Width: =Parent.Width - Round(32 * UI, 0) - Round(110 * UI, 0)
                              X: =Round(16 * UI, 0)
                              Y: =Round(70 * UI, 0)
                            Children:
                              - conPerP_Dsh:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =If(ThisItem.Key = varDashPeriod, C_Accent, C_Line)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Key = varDashPeriod, C_Accent, C_White)
                                    Height: =Round(48 * UI, 0)
                                    RadiusBottomLeft: =Round(24 * UI, 0)
                                    RadiusBottomRight: =Round(24 * UI, 0)
                                    RadiusTopLeft: =Round(24 * UI, 0)
                                    RadiusTopRight: =Round(24 * UI, 0)
                                    Width: =Parent.TemplateWidth - Round(6 * UI, 0)
                                    X: =3
                                    Y: =Round(2 * UI, 0)
                                  Children:
                                    - lblPerP_Dsh:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =If(ThisItem.Key = varDashPeriod, C_White, C_Ink2)
                                          Font: =AppFont
                                          FontWeight: =FontWeight.Bold
                                          Height: =Round(48 * UI, 0)
                                          Size: =Round(11 * UI, 0)
                                          Text: =ThisItem.Label
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width - Round(8 * UI, 0)
                                          Wrap: =false
                                          X: =Round(4 * UI, 0)
                                    - btnPerP_Dsh:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Appearance: =ButtonAppearance.Transparent
                                          BorderStyle: =BorderStyle.None
                                          FontWeight: =""
                                          Height: =Parent.Height
                                          OnSelect: |-
                                            =Set(varDashPeriod, ThisItem.Key);
                                            Select(btnCalc_Dsh)
                                          PaddingBottom: =5
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =5
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Text: =""
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width
                        - conMine_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(varDashMine, C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varDashMine, C_Accent, C_White)
                              Height: =Round(48 * UI, 0)
                              RadiusBottomLeft: =Round(24 * UI, 0)
                              RadiusBottomRight: =Round(24 * UI, 0)
                              RadiusTopLeft: =Round(24 * UI, 0)
                              RadiusTopRight: =Round(24 * UI, 0)
                              Width: =Round(104 * UI, 0)
                              X: =Parent.Width - Round(16 * UI, 0) - Round(104 * UI, 0)
                              Y: =Round(72 * UI, 0)
                            Children:
                              - btnMine_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(varDashMine, C_White, C_Ink2)
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varDashMine, !varDashMine);
                                      Select(btnCalc_Dsh)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(24 * UI, 0)
                                    RadiusBottomRight: =Round(24 * UI, 0)
                                    RadiusTopLeft: =Round(24 * UI, 0)
                                    RadiusTopRight: =Round(24 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =If(varDashMine, "✓  Mine", "Mine")
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                  - lblLoading_Dsh:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Color: =C_Muted
                        Font: =AppFont
                        Height: =Round(26 * UI, 0)
                        LayoutMinHeight: =Round(26 * UI, 0)
                        Size: =Round(12 * UI, 0)
                        Text: ="Loading ideas..."
                        Visible: =varDashLoading
                        Width: =DashW
                        Wrap: =false
                  - conKpi_Dsh:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(DashWide, Round(112 * UI, 0), 3 * Round(112 * UI, 0) + 2 * DashGap)
                        LayoutMinHeight: =If(DashWide, Round(112 * UI, 0), 3 * Round(112 * UI, 0) + 2 * DashGap)
                        Width: =DashW
                      Children:
                        - conKAll_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(false, C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(false, C_AccentSoft, C_White)
                              Height: =Round(112 * UI, 0)
                              RadiusBottomLeft: =Round(20 * UI, 0)
                              RadiusBottomRight: =Round(20 * UI, 0)
                              RadiusTopLeft: =Round(20 * UI, 0)
                              RadiusTopRight: =Round(20 * UI, 0)
                              Width: =If(DashWide, (DashW - 4 * DashGap) / 5, (DashW - DashGap) / 2)
                              X: =If(DashWide, 0 * ((DashW - 4 * DashGap) / 5 + DashGap), 0 * ((DashW - DashGap) / 2 + DashGap))
                              Y: =If(DashWide, 0, 0 * (Round(112 * UI, 0) + DashGap))
                            Children:
                              - lblKAllC_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="IDEAS"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(14 * UI, 0)
                              - lblKAllV_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(46 * UI, 0)
                                    Size: =Round(28 * UI, 0)
                                    Text: =varDashN
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(34 * UI, 0)
                              - lblKAllS_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =Switch(varDashPeriod, "Today", "Today", "7", "Last 7 days", "30", "Last 30 days", "All time")
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(80 * UI, 0)
                              - btnKAll_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varDashFKind, "");
                                      Set(varDashFVal, "")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                        - conKNew_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(varDashFKind = "Status" && varDashFVal = "New", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varDashFKind = "Status" && varDashFVal = "New", C_AccentSoft, C_White)
                              Height: =Round(112 * UI, 0)
                              RadiusBottomLeft: =Round(20 * UI, 0)
                              RadiusBottomRight: =Round(20 * UI, 0)
                              RadiusTopLeft: =Round(20 * UI, 0)
                              RadiusTopRight: =Round(20 * UI, 0)
                              Width: =If(DashWide, (DashW - 4 * DashGap) / 5, (DashW - DashGap) / 2)
                              X: =If(DashWide, 1 * ((DashW - 4 * DashGap) / 5 + DashGap), 1 * ((DashW - DashGap) / 2 + DashGap))
                              Y: =If(DashWide, 0, 0 * (Round(112 * UI, 0) + DashGap))
                            Children:
                              - lblKNewC_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="NEW"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(14 * UI, 0)
                              - lblKNewV_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Accent
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(46 * UI, 0)
                                    Size: =Round(28 * UI, 0)
                                    Text: =varDashNewN
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(34 * UI, 0)
                              - lblKNewS_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="Not yet reviewed"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(80 * UI, 0)
                              - btnKNew_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: =If(varDashFKind = "Status" && varDashFVal = "New", Set(varDashFKind, ""); Set(varDashFVal, ""), Set(varDashFKind, "Status"); Set(varDashFVal, "New"))
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                        - conKHigh_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(varDashFKind = "Priority" && varDashFVal = "High", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varDashFKind = "Priority" && varDashFVal = "High", C_AccentSoft, C_White)
                              Height: =Round(112 * UI, 0)
                              RadiusBottomLeft: =Round(20 * UI, 0)
                              RadiusBottomRight: =Round(20 * UI, 0)
                              RadiusTopLeft: =Round(20 * UI, 0)
                              RadiusTopRight: =Round(20 * UI, 0)
                              Width: =If(DashWide, (DashW - 4 * DashGap) / 5, (DashW - DashGap) / 2)
                              X: =If(DashWide, 2 * ((DashW - 4 * DashGap) / 5 + DashGap), 0 * ((DashW - DashGap) / 2 + DashGap))
                              Y: =If(DashWide, 0, 1 * (Round(112 * UI, 0) + DashGap))
                            Children:
                              - lblKHighC_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="HIGH PRIORITY"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(14 * UI, 0)
                              - lblKHighV_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(176, 52, 40, 1)
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(46 * UI, 0)
                                    Size: =Round(28 * UI, 0)
                                    Text: =varDashHighN
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(34 * UI, 0)
                              - lblKHighS_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =Round((If(varDashN > 0, varDashHighN / varDashN, 0)) * 100, 0) & "% of " & varDashN
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(80 * UI, 0)
                              - btnKHigh_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
