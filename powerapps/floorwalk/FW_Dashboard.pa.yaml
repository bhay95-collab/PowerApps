                        - capDetNote_Dsh:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              Color: =C_Muted
                              FillPortions: =0
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(30 * UI, 0)
                              LayoutMinHeight: =Round(30 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="REVIEW NOTES"
                              Width: =Min(App.Width - Round(24 * UI, 0), Round(900 * UI, 0)) - Round(40 * UI, 0)
                              Wrap: =false
                        - txtRevNotes_Dsh:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =RGBA(14, 42, 70, 0.22)
                              BorderThickness: =1
                              Color: =C_Ink
                              Default: =varDashSel.ReviewNotes
                              FillPortions: =0
                              FocusedBorderColor: =C_Accent
                              FocusedBorderThickness: =2
                              Font: =AppFont
                              Height: =Round(110 * UI, 0)
                              HintText: ="What was decided, who owns it, next step"
                              LayoutMinHeight: =Round(110 * UI, 0)
                              Mode: =TextMode.MultiLine
                              RadiusBottomLeft: =Round(12 * UI, 0)
                              RadiusBottomRight: =Round(12 * UI, 0)
                              RadiusTopLeft: =Round(12 * UI, 0)
                              RadiusTopRight: =Round(12 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Width: =Min(App.Width - Round(24 * UI, 0), Round(900 * UI, 0)) - Round(40 * UI, 0)
                        - conDetSave_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Fill: =If(btnDetSave_Dsh.DisplayMode = DisplayMode.Edit, C_Accent, RGBA(160, 174, 180, 1))
                              FillPortions: =0
                              Height: =Round(56 * UI, 0)
                              LayoutMinHeight: =Round(56 * UI, 0)
                              RadiusBottomLeft: =Round(28 * UI, 0)
                              RadiusBottomRight: =Round(28 * UI, 0)
                              RadiusTopLeft: =Round(28 * UI, 0)
                              RadiusTopRight: =Round(28 * UI, 0)
                              Width: =Min(App.Width - Round(24 * UI, 0), Round(900 * UI, 0)) - Round(40 * UI, 0)
                            Children:
                              - lblDetSave_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =C_White
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(56 * UI, 0)
                                    Size: =Round(14 * UI, 0)
                                    Text: =If(varSaving, "Saving...", btnDetSave_Dsh.DisplayMode = DisplayMode.Edit, "Save Changes", "No changes to save")
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                                    Wrap: =false
                              - btnDetSave_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    DisplayMode: =If((varDetStatus <> varDashSel.Status || varDetPri <> varDashSel.Priority || Trim(txtRevNotes_Dsh.Text) <> Coalesce(varDashSel.ReviewNotes, "")) && !varSaving, DisplayMode.Edit, DisplayMode.Disabled)
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varSaving, true);
                                      With(
                                          { fresh: LookUp(Floorwalk_Ideas, ID = varDashSel.ID) },
                                          If(
                                              IsBlank(fresh),
                                              Set(varSaving, false);
                                              Notify("This idea could not be found. Tap Refresh.", NotificationType.Error),
                                              // someone else saved this idea after the dashboard loaded: don't overwrite their change
                                              fresh.Modified > varDashSel.Modified,
                                              Set(varSaving, false);
                                              Notify("Someone updated this idea a moment ago. Tap Refresh, then try again.", NotificationType.Warning),
                                              With(
                                                  {
                                                      rec: Patch(
                                                          Floorwalk_Ideas,
                                                          fresh,
                                                          {
                                                              Status: varDetStatus,
                                                              Priority: varDetPri,
                                                              ReviewNotes: Trim(txtRevNotes_Dsh.Text),
                                                              StatusBy: MeName,
                                                              StatusOn: Now()
                                                          }
                                                      )
                                                  },
                                                  If(
                                                      IsEmpty(Errors(Floorwalk_Ideas)),
                                                      Patch(
                                                          colDashRows,
                                                          LookUp(colDashRows, ID = rec.ID),
                                                          { Status: rec.Status, Priority: rec.Priority, ReviewNotes: Coalesce(rec.ReviewNotes, ""), StatusBy: rec.StatusBy, StatusOn: rec.StatusOn, Modified: rec.Modified }
                                                      );
                                                      Set(varDashSel, LookUp(colDashRows, ID = rec.ID));
                                                      Select(btnCalc_Dsh);
                                                      Set(varSaving, false);
                                                      Notify("Saved.", NotificationType.Success),
                                                      Set(varSaving, false);
                                                      Notify("Could not save. Check your connection and try again.", NotificationType.Error)
                                                  )
                                              )
                                          )
                                      )
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                        - lblDetLast_Dsh:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              Color: =C_Muted
                              FillPortions: =0
                              Font: =AppFont
                              Height: =Round(24 * UI, 0)
                              LayoutMinHeight: =Round(24 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: =If(IsBlank(varDashSel.StatusBy), "Not reviewed yet", "Last updated by " & varDashSel.StatusBy & " on " & Text(varDashSel.StatusOn, "d mmm yyyy, h:mm AM/PM"))
                              Width: =Min(App.Width - Round(24 * UI, 0), Round(900 * UI, 0)) - Round(40 * UI, 0)
                              Wrap: =false
                        - conDetEnd_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =Round(16 * UI, 0)
                              LayoutMinHeight: =Round(16 * UI, 0)
                              Width: =Min(App.Width - Round(24 * UI, 0), Round(900 * UI, 0)) - Round(40 * UI, 0)
      - btnLoad_Dsh:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =// LOAD: newest 2000 ideas, flattened to plain columns once (the screen then works on the device)
              Set(varDashLoading, true);
              Refresh(Floorwalk_Ideas);
              ClearCollect(colDashSrc, Sort(Floorwalk_Ideas, Created, SortOrder.Descending));
              ClearCollect(
                  colDashRows,
                  ForAll(
                      colDashSrc As a,
                      {
                          ID: a.ID,
                          When: a.Created,
                          Modified: a.Modified,
                          Walker: a.'Created By'.DisplayName,
                          WalkerEmail: Lower(a.'Created By'.Email),
                          Idea: Coalesce(a.Idea, a.Title),
                          Service: a.Service,
                          Line: a.ServiceLine,
                          Stream: If(IsBlank(a.Stream), "Other", a.Stream),
                          StreamShort: Coalesce(LookUp(StreamList, Key = a.Stream).Short, "Other"),
                          Loc: a.Location,
                          Stake: a.StakeholderName,
                          StakeEmail: a.StakeholderEmail,
                          StakeJob: a.StakeholderJobTitle,
                          StakeDept: a.StakeholderDept,
                          Follow: a.FollowUp = "Yes",
                          Theme: Coalesce(a.Theme, "Other"),
                          ThemeOther: a.ThemeOther,
                          Priority: Coalesce(a.Priority, "Medium"),
                          Status: Coalesce(a.Status, "New"),
                          ReviewNotes: Coalesce(a.ReviewNotes, ""),
                          StatusBy: a.StatusBy,
                          StatusOn: a.StatusOn
                      }
                  )
              );
              Set(varDashLoading, false);
              Select(btnCalc_Dsh)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(11 * UI, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnCalc_Dsh:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =// CALC: apply Mine + period + stream, then every number and bar on the screen
              ClearCollect(
                  colDashBase,
                  Filter(
                      colDashRows,
                      (!varDashMine || WalkerEmail = MeEmail)
                      && Switch(
                          varDashPeriod,
                          "Today", When >= Today(),
                          "7", When >= DateAdd(Today(), -6, TimeUnit.Days),
                          "30", When >= DateAdd(Today(), -29, TimeUnit.Days),
                          true
                      )
                  )
              );
              ClearCollect(colDash, Filter(colDashBase, varDashStream = "ALL" || Stream = varDashStream));
              Set(varDashBaseN, CountRows(colDashBase));
              Set(varDashN, CountRows(colDash));
              Set(varDashNewN, CountIf(colDash, Status = "New"));
              Set(varDashHighN, CountIf(colDash, Priority = "High"));
              Set(varDashFolN, CountIf(colDash, Follow));
              Set(varDashActN, CountIf(colDash, Status = "Actioned"));
              // by stream ignores the stream filter, so every stream stays visible
              ClearCollect(colDashStr, ForAll(StreamList As s, { Key: s.Key, N: CountIf(colDashBase, Stream = s.Key) }));
              ClearCollect(colDashTheme, ForAll(ThemeList As t, { Key: t.Value, N: CountIf(colDash, Theme = t.Value) }));
              ClearCollect(colDashStat, ForAll(StatusList As t, { Key: t.Value, N: CountIf(colDash, Status = t.Value) }));
              ClearCollect(
                  colDashSvc,
                  FirstN(
                      SortByColumns(
                          ForAll(Filter(Distinct(colDash, Service), !IsBlank(Value)) As s, { Key: s.Value, N: CountIf(colDash, Service = s.Value) }),
                          "N",
                          SortOrder.Descending
                      ),
                      6
                  )
              );
              Set(varDashMaxSvc, Max(colDashSvc, N));
              Set(varDashNoSvcN, CountIf(colDash, IsBlank(Service)));
              ClearCollect(
                  colDashWalk,
                  FirstN(
                      SortByColumns(
                          ForAll(Filter(Distinct(colDash, Walker), !IsBlank(Value)) As s, { Key: s.Value, N: CountIf(colDash, Walker = s.Value) }),
                          "N",
                          SortOrder.Descending
                      ),
                      6
                  )
              );
              Set(varDashMaxWalk, Max(colDashWalk, N))
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(11 * UI, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
