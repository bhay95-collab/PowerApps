                                    RadiusTopRight: =Round(24 * UI, 0)
                                    Width: =(Parent.Width - 2 * Round(10 * UI, 0)) / 3
                                    X: =2 * ((Parent.Width - 2 * Round(10 * UI, 0)) / 3 + Round(10 * UI, 0))
                                    Y: =0
                                  Children:
