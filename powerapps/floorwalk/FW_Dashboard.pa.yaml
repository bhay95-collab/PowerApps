                                        Properties:
                                          Align: =Align.Center
                                          Appearance: =ButtonAppearance.Transparent
                                          Color: =If(varDetPri = "High", C_White, C_Ink2)
                                          Font: =AppFont
                                          FontWeight: =FontWeight.Bold
