            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =// ME TOO: add the user's vote to an idea already logged (re-read first, one vote per person)
              Set(varSaving, true);
              With(
                  { fresh: LookUp(Floorwalk_Ideas, ID = varVoteID) },
                  If(
                      IsBlank(fresh),
                      Notify("That idea could not be found.", NotificationType.Error),
                      (";" & MeEmail & ";") in Lower(Coalesce(fresh.Voters, "")) || Lower(fresh.'Created By'.Email) = MeEmail,
                      Notify("You have already added this one.", NotificationType.Information),
                      With(
                          { r: Patch(Floorwalk_Ideas, fresh, { Votes: Coalesce(fresh.Votes, 0) + 1, Voters: Coalesce(fresh.Voters, ";") & MeEmail & ";" }) },
                          If(
                              IsEmpty(Errors(Floorwalk_Ideas)),
                              Patch(colIdeas_Cap, LookUp(colIdeas_Cap, ID = r.ID), { Votes: r.Votes, Voters: Lower(r.Voters) });
