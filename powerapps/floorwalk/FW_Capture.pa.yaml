                        RadiusTopRight: =Round(20 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - cap_Idea:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(22 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="2  ·  THE IDEA"
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(14 * UI, 0)
                        - q_Idea:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
