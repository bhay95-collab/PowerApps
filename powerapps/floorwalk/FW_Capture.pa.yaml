                      Children:
                        - lblSubmit_Cap:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =C_White
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(60 * UI, 0)
                              Size: =If(btnSubmit_Cap.DisplayMode = DisplayMode.Edit || varSaving, Round(15 * UI, 0), Round(12 * UI, 0))
                              Text: =If(varSaving, "Saving...", btnSubmit_Cap.DisplayMode = DisplayMode.Edit, If(Connection.Connected, "Submit Idea", "Save on This Phone"), "Add a summary, theme and priority")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                              Wrap: =false
                        - btnSubmit_Cap:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              DisplayMode: =If(!IsBlank(Trim(txtSummary_Cap.Text)) && !IsBlank(varTheme) && (!(varTheme = "Other") || !IsBlank(Trim(txtThemeOther_Cap.Text))) && !IsBlank(varPri) && !varSaving, DisplayMode.Edit, DisplayMode.Disabled)
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: |-
                                =Set(varSaving, true);
                                If(
                                    !Connection.Connected,
                                    // OFFLINE: keep it on this phone; Home uploads it when there is signal
                                    IfError(LoadData(colQueue, "fwQueue", true), false);
                                    Collect(
                                        colQueue,
                                        {
                                            Title: Trim(txtSummary_Cap.Text),
                                            Idea: Trim(txtIdea_Cap.Text),
                                            Service: varSvc.Service,
                                            ServiceLine: varSvc.Line,
                                            Stream: If(IsBlank(varSvc.Service), Blank(), Coalesce(varSvc.Stream, "Other")),
                                            Location: Trim(txtLoc_Cap.Text),
                                            Module: varModule,
                                            StakeholderName: If(varStakeMode = "Dir", varStake.Name, varStakeMode = "Manual", Trim(txtStakeName_Cap.Text), Blank()),
                                            StakeholderEmail: If(varStakeMode = "Dir", varStake.Email, Blank()),
                                            StakeholderJobTitle: If(varStakeMode = "Dir", varStake.Job, Blank()),
                                            StakeholderDept: If(varStakeMode = "Dir", varStake.Dept, Blank()),
                                            FollowUp: If(((varStakeMode = "Dir" && !IsBlank(varStake.Name)) || (varStakeMode = "Manual" && !IsBlank(Trim(txtStakeName_Cap.Text)))) && varFollow = "Yes", "Yes", "No"),
                                            Theme: varTheme,
                                            ThemeOther: If((varTheme = "Other"), Trim(txtThemeOther_Cap.Text), Blank()),
                                            Priority: varPri,
                                            SafetyConcern: If((varSafety = "Yes"), "Yes", "No"),
                                            Status: "New",
                                            Votes: 0,
                                            QID: Text(GUID()),
                                            Photo: If(IsBlank(addPhoto_Cap.Media), Blank(), imgPhoto_Cap.Image)
                                        }
                                    );
                                    IfError(SaveData(colQueue, "fwQueue"), Notify("Kept for now. Keep the app open until you have signal.", NotificationType.Warning));
                                    Set(varSaving, false);
                                    Set(varDoneMode, "Offline");
                                    Set(varShowDone, true),
                                    // ONLINE
                                    With(
                                        {
                                            rec: Patch(
                                                Floorwalk_Ideas,
                                                Defaults(Floorwalk_Ideas),
                                                {
                                                    Title: Trim(txtSummary_Cap.Text),
                                                    Idea: Trim(txtIdea_Cap.Text),
                                                    Service: varSvc.Service,
                                                    ServiceLine: varSvc.Line,
                                                    Stream: If(IsBlank(varSvc.Service), Blank(), Coalesce(varSvc.Stream, "Other")),
                                                    Location: Trim(txtLoc_Cap.Text),
                                                    Module: varModule,
                                                    StakeholderName: If(varStakeMode = "Dir", varStake.Name, varStakeMode = "Manual", Trim(txtStakeName_Cap.Text), Blank()),
                                                    StakeholderEmail: If(varStakeMode = "Dir", varStake.Email, Blank()),
                                                    StakeholderJobTitle: If(varStakeMode = "Dir", varStake.Job, Blank()),
                                                    StakeholderDept: If(varStakeMode = "Dir", varStake.Dept, Blank()),
                                                    FollowUp: If(((varStakeMode = "Dir" && !IsBlank(varStake.Name)) || (varStakeMode = "Manual" && !IsBlank(Trim(txtStakeName_Cap.Text)))) && varFollow = "Yes", "Yes", "No"),
                                                    Theme: varTheme,
                                                    ThemeOther: If((varTheme = "Other"), Trim(txtThemeOther_Cap.Text), Blank()),
                                                    Priority: varPri,
                                                    SafetyConcern: If((varSafety = "Yes"), "Yes", "No"),
                                                    Status: "New",
                                                    Votes: 0
                                                }
                                            )
                                        },
