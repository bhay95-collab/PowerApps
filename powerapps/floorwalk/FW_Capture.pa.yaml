                        LayoutMinHeight: =Round((84 + Max(1, CountRows(galSim_Cap.AllItems)) * 84) * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Visible: =CountRows(galSim_Cap.AllItems) > 0
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - cap_Sim:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Amber
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(22 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="ALREADY LOGGED?"
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(14 * UI, 0)
                        - q_Sim:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(26 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: ="Tap Me Too instead of adding it again"
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(38 * UI, 0)
                        - galSim_Cap:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Height: =Max(1, CountRows(Self.AllItems)) * Round(84 * UI, 0)
                              Items: |-
                                =With(
                                    {
                                        w: Filter(
                                            Split(Lower(Trim(txtSummary_Cap.Text)), " "),
                                            Len(Value) >= 4 && !(Value in ["with", "when", "that", "this", "from", "have", "they", "there", "their", "them", "then", "than", "into", "would", "should", "could", "need", "needs", "about", "after", "before", "where", "what", "which", "patient", "patients", "staff", "ward", "wards", "ieMR", "iemr", "using", "being", "does", "doesn't", "can't", "cant", "dont", "don't"])
                                        )
                                    },
                                    If(
                                        CountRows(w) = 0,
                                        FirstN(colIdeas_Cap, 0),
                                        FirstN(
                                            SortByColumns(
                                                Filter(
                                                    AddColumns(colIdeas_Cap, Score, CountRows(Filter(w, Value in Hay))),
                                                    Score >= Min(2, CountRows(w))
                                                ),
                                                "Score",
                                                SortOrder.Descending,
                                                "Votes",
                                                SortOrder.Descending
                                            ),
                                            3
                                        )
                                    )
                                )
