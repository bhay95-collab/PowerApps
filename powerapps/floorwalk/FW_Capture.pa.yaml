                                                !IsBlank(addPhoto_Cap.Media),
                                                Patch(Floorwalk_Ideas, rec, { Photo: imgPhoto_Cap.Image });
                                                If(!IsEmpty(Errors(Floorwalk_Ideas, rec)), Notify("Idea saved, but the photo could not be attached.", NotificationType.Warning))
                                            );
                                            If((varSafety = "Yes"), If(
                                    !IsBlank(SafetyAlertTo),
                                    IfError(
                                        Office365Outlook.SendEmailV2(
                                            SafetyAlertTo,
                                            "Patient safety concern: " & Trim(txtSummary_Cap.Text),
                                            Substitute(Substitute(EmailHead, "{{TITLE}}", "Patient Safety Concern"), "{{SUB}}", Coalesce(varSvc.Service, "No service recorded")) &
                                            "<tr><td style='padding:24px 32px 8px 32px;font-size:15px;line-height:22px;color:#3A5068;'>A floorwalker flagged an idea as a possible patient safety concern. Please check a RiskMan has been logged.</td></tr>" &
                                            "<tr><td style='padding:8px 32px 24px 32px;'><table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='font-size:14px;'>" &
                                                "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>SUMMARY</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(Trim(txtSummary_Cap.Text), ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                                "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>DETAIL</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(Trim(txtIdea_Cap.Text), ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                                "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>SERVICE</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(varSvc.Service, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                                "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>LOCATION</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(Trim(txtLoc_Cap.Text), ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                                "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>IEMR AREA</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(varModule, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                                "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>STAKEHOLDER</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(If(varStakeMode = "Dir", varStake.Name, varStakeMode = "Manual", Trim(txtStakeName_Cap.Text), Blank()), ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                                "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>PRIORITY</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(varPri, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                                "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>FLOORWALKER</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(MeName, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                                            "</table></td></tr>" &
                                            Substitute(EmailFoot, "{{NOTE}}", "Raised in the Floorwalking Ideas app."),
                                            { Importance: "High" }
                                        ),
                                        Notify("Saved, but the safety email could not be sent. Tell the CITTA lead directly.", NotificationType.Warning)
                                    )
                                ));
                                            // so the duplicate check sees it straight away
                                            Collect(colIdeas_Cap, { ID: rec.ID, Summary: rec.Title, Service: Coalesce(rec.Service, ""), Status: "New", Votes: 0, Voters: "", Creator: MeEmail, Hay: Lower(rec.Title & " " & rec.Idea & " " & rec.Service & " " & rec.Module) });
                                            Set(varSaving, false);
                                            Set(varDoneMode, "Saved");
                                            Set(varShowDone, true),
                                            Set(varSaving, false);
                                            Notify("Could not save. Check your connection and try again.", NotificationType.Error)
                                        )
                                    )
                                )
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
