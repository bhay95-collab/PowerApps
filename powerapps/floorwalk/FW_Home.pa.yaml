Screens:
  Home:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =Set(varHmLoading, true);
        Refresh(Floorwalk_Ideas);
        // today's ideas only (delegable date filter), counted on the device
        ClearCollect(colToday_Hm, Filter(Floorwalk_Ideas, Created >= Today()));
        Set(varHmTeamN, CountRows(colToday_Hm));
        Set(varHmMineN, CountIf(colToday_Hm, Lower('Created By'.Email) = MeEmail));
        // all-time counts (fine up to the 2000 row limit; see docs/05)
        ClearCollect(colMine_Hm, Filter(Floorwalk_Ideas, 'Created By'.Email = User().Email));
        Set(varHmMineAllN, CountRows(colMine_Hm));
        Set(varHmAllN, CountRows(Floorwalk_Ideas));
        Set(varHmLoading, false)
    Children:
      - conRoot_Hm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Hm:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(165 * UI, 0)
                  LayoutMinHeight: =Round(165 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Hm:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - lblKicker_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(23 * UI, 0)
                        Size: =Round(11 * UI, 0)
                        Text: ="RBWH POST GO-LIVE"
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(33 * UI, 0)
                  - lblTitle_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(70 * UI, 0)
                        Size: =Round(28 * UI, 0)
                        Text: ="Floorwalking Ideas"
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(45 * UI, 0)
                  - lblHello_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.9)
                        Font: =AppFont
                        Height: =Round(28 * UI, 0)
                        Size: =Round(13 * UI, 0)
                        Text: ="Hi " & MeFirst & "  ·  " & Text(Today(), "dddd d mmmm")
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(110 * UI, 0)
            - conBody_Hm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =Round(15 * UI, 0)
                  LayoutMinHeight: =Round(250 * UI, 0)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =Round(30 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingTop: =Round(20 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conHero_Hm:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =C_Accent
                        FillPortions: =0
                        Height: =Round(120 * UI, 0)
                        LayoutMinHeight: =Round(120 * UI, 0)
                        RadiusBottomLeft: =Round(25 * UI, 0)
                        RadiusBottomRight: =Round(25 * UI, 0)
                        RadiusTopLeft: =Round(25 * UI, 0)
                        RadiusTopRight: =Round(25 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conHeroIc_Hm:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 0.16)
                              Height: =Round(56 * UI, 0)
                              RadiusBottomLeft: =Round(28 * UI, 0)
                              RadiusBottomRight: =Round(28 * UI, 0)
                              RadiusTopLeft: =Round(28 * UI, 0)
                              RadiusTopRight: =Round(28 * UI, 0)
                              Width: =Round(56 * UI, 0)
                              X: =Round(20 * UI, 0)
                              Y: =Round(32 * UI, 0)
                            Children:
                              - icoHero_Hm:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(34 * UI, 0)
                                    Icon: ="Edit"
                                    IconColor: =C_White
                                    IconStyle: =IconStyle.Filled
                                    Width: =Round(34 * UI, 0)
                                    X: =Round(11 * UI, 0)
                                    Y: =Round(11 * UI, 0)
                        - lblHeroT_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_White
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(32 * UI, 0)
                              Size: =Round(19 * UI, 0)
                              Text: ="Capture an Idea"
                              Width: =Parent.Width - Round(108 * UI, 0)
                              Wrap: =false
                              X: =Round(92 * UI, 0)
                              Y: =Round(32 * UI, 0)
                        - lblHeroS_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 0.85)
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: ="Takes under a minute"
                              Width: =Parent.Width - Round(108 * UI, 0)
                              Wrap: =false
                              X: =Round(92 * UI, 0)
                              Y: =Round(66 * UI, 0)
                        - btnHero_Hm:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: =Navigate(Capture, ScreenTransition.Cover)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                  - conToday_Hm:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(112 * UI, 0)
                        LayoutMinHeight: =Round(112 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - lblTodayCap_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(18 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="TODAY"
                              Width: =Parent.Width - Round(40 * UI, 0)
                              Wrap: =false
                              X: =Round(20 * UI, 0)
                              Y: =Round(12 * UI, 0)
                        - lblTodayT_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(32 * UI, 0)
                              Size: =Round(18 * UI, 0)
                              Text: =If(varHmLoading, "Loading...", varHmTeamN & If(varHmTeamN = 1, " idea", " ideas") & " captured")
                              Width: =Parent.Width - Round(40 * UI, 0)
                              Wrap: =false
                              X: =Round(20 * UI, 0)
                              Y: =Round(32 * UI, 0)
                        - lblTodayS_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink2
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: |-
                                ="You: " & varHmMineN & "  ·  All floorwalkers: " & varHmTeamN & "  ·  All time: " & varHmAllN
                              Width: =Parent.Width - Round(40 * UI, 0)
                              Wrap: =false
                              X: =Round(20 * UI, 0)
                              Y: =Round(68 * UI, 0)
                  - capOther_Hm:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Color: =C_Muted
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(23 * UI, 0)
                        LayoutMinHeight: =Round(23 * UI, 0)
                        Size: =Round(11 * UI, 0)
                        Text: ="SEE WHAT IS COMING IN"
                        Width: =PageW - Round(40 * UI, 0)
                        Wrap: =false
                  - conTileDash_Hm:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(90 * UI, 0)
                        LayoutMinHeight: =Round(90 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conTileIcDash_Hm:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =C_AccentSoft
                              Height: =Round(55 * UI, 0)
                              RadiusBottomLeft: =Round(28 * UI, 0)
                              RadiusBottomRight: =Round(28 * UI, 0)
                              RadiusTopLeft: =Round(28 * UI, 0)
                              RadiusTopRight: =Round(28 * UI, 0)
                              Width: =Round(55 * UI, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(18 * UI, 0)
                            Children:
                              - icoTileDash_Hm:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(30 * UI, 0)
                                    Icon: ="AppsList"
                                    IconColor: =C_Accent
                                    IconStyle: =IconStyle.Filled
                                    Width: =Round(30 * UI, 0)
                                    X: =Round(13 * UI, 0)
                                    Y: =Round(13 * UI, 0)
                        - lblTileTDash_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(26 * UI, 0)
                              Size: =Round(15 * UI, 0)
                              Text: ="Ideas Dashboard"
                              Width: =Parent.Width - Round(130 * UI, 0)
                              Wrap: =false
                              X: =Round(88 * UI, 0)
                              Y: =Round(18 * UI, 0)
                        - lblTileSDash_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: ="Overview and every idea"
                              Width: =Parent.Width - Round(130 * UI, 0)
                              Wrap: =false
                              X: =Round(88 * UI, 0)
                              Y: =Round(46 * UI, 0)
                        - icoTileGoDash_Hm:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(24 * UI, 0)
                              Icon: ="ChevronRight"
                              IconColor: =C_Muted
                              Width: =Round(24 * UI, 0)
                              X: =Parent.Width - Round(38 * UI, 0)
                              Y: =Round(33 * UI, 0)
                        - btnTileDash_Hm:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: |-
                                =Set(varDashMine, false);
                                Navigate(Dashboard, ScreenTransition.Cover)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                  - conTileMine_Hm:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(90 * UI, 0)
                        LayoutMinHeight: =Round(90 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conTileIcMine_Hm:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =C_AmberBg
                              Height: =Round(55 * UI, 0)
                              RadiusBottomLeft: =Round(28 * UI, 0)
                              RadiusBottomRight: =Round(28 * UI, 0)
                              RadiusTopLeft: =Round(28 * UI, 0)
                              RadiusTopRight: =Round(28 * UI, 0)
                              Width: =Round(55 * UI, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(18 * UI, 0)
                            Children:
                              - icoTileMine_Hm:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(30 * UI, 0)
                                    Icon: ="Person"
                                    IconColor: =C_Amber
                                    IconStyle: =IconStyle.Filled
                                    Width: =Round(30 * UI, 0)
                                    X: =Round(13 * UI, 0)
                                    Y: =Round(13 * UI, 0)
                        - lblTileTMine_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(26 * UI, 0)
                              Size: =Round(15 * UI, 0)
                              Text: ="My Ideas"
                              Width: =Parent.Width - Round(130 * UI, 0)
                              Wrap: =false
                              X: =Round(88 * UI, 0)
                              Y: =Round(18 * UI, 0)
                        - lblTileSMine_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: =varHmMineAllN & If(varHmMineAllN = 1, " idea", " ideas") & " captured by you"
                              Width: =Parent.Width - Round(130 * UI, 0)
                              Wrap: =false
                              X: =Round(88 * UI, 0)
                              Y: =Round(46 * UI, 0)
                        - icoTileGoMine_Hm:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(24 * UI, 0)
                              Icon: ="ChevronRight"
                              IconColor: =C_Muted
                              Width: =Round(24 * UI, 0)
                              X: =Parent.Width - Round(38 * UI, 0)
                              Y: =Round(33 * UI, 0)
                        - btnTileMine_Hm:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: |-
                                =Set(varDashMine, true);
                                Navigate(Dashboard, ScreenTransition.Cover)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                  - conEnd_Hm:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Round(16 * UI, 0)
                        LayoutMinHeight: =Round(16 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
