Screens:
  RuleView:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// the PDF comes from the GetRulePdf flow as base64; the PDF viewer shows varRulePdf
        Set(varRulePdf, Blank());
        Set(varRuleFail, false);
        Set(varRvLoading, true);
        If(
            IsBlank(varRule.Path),
            Set(varRuleFail, true),
            IfError(Set(varRulePdf, GetRulePdf.Run(varRule.Path).pdf), Set(varRuleFail, true))
        );
        If(IsBlank(varRulePdf), Set(varRuleFail, true));
        Set(varRvLoading, false)
    Children:
      - conRoot_Rv:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Rv:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Rv:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Rv:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =Navigate(Rules, ScreenTransition.UnCoverRight)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(24 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Rv:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(50 * UI, 0)
                        Size: =Round(14 * UI, 0)
                        Text: =varRule.Title
                        Width: =PageW - Round(85 * UI, 0)
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(8 * UI, 0)
                  - lblHdrS_Rv:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Font: =AppFont
                        Height: =Round(25 * UI, 0)
                        Size: =Round(11 * UI, 0)
                        Text: =varRule.Sec
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(60 * UI, 0)
            - conBody_Rv:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =C_White
                  LayoutMinHeight: =Round(250 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - lblLoad_Rv:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =C_Muted
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(30 * UI, 0)
                        Size: =Round(13 * UI, 0)
                        Text: ="Loading document..."
                        Visible: =varRvLoading
                        Width: =PageW - Round(40 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(20 * UI, 0)
                        Y: =Round(120 * UI, 0)
                  - conFail_Rv:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(178, 105, 0, 0.35)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_AmberBg
                        Height: =Round(110 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Visible: =varRuleFail && !varRvLoading
                        Width: =PageW - Round(40 * UI, 0)
                        X: =Gutter + Round(20 * UI, 0)
                        Y: =Round(20 * UI, 0)
                      Children:
                        - lblFailCap_Rv:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Amber
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(20 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="COULD NOT OPEN HERE"
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(14 * UI, 0)
                        - lblFail_Rv:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(54 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: =If(Connection.Connected, "Tap Open in Browser below to read this document.", "No signal. Get signal, then go back and open it again.")
                              Width: =Parent.Width - Round(36 * UI, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(40 * UI, 0)
            - conFoot_Rv:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =C_Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =C_White
                  FillPortions: =0
                  Height: =Round(84 * UI, 0)
                  LayoutMinHeight: =Round(84 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conBrowser_Rv:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =C_Accent
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =If(varRuleFail, C_Accent, C_White)
                        Height: =Round(60 * UI, 0)
                        RadiusBottomLeft: =Round(28 * UI, 0)
                        RadiusBottomRight: =Round(28 * UI, 0)
                        RadiusTopLeft: =Round(28 * UI, 0)
                        RadiusTopRight: =Round(28 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                        X: =Gutter + Round(20 * UI, 0)
                        Y: =Round(12 * UI, 0)
                      Children:
                        - lblBrowser_Rv:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =If(varRuleFail, C_White, C_Accent)
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(60 * UI, 0)
                              Size: =Round(14 * UI, 0)
                              Text: ="Open in Browser"
                              Width: =Parent.Width
                              Wrap: =false
                        - btnBrowser_Rv:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              DisplayMode: =If(Connection.Connected, DisplayMode.Edit, DisplayMode.Disabled)
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: =Launch(RuleSiteUrl & Substitute(Substitute(EncodeUrl(varRule.Path), "%2F", "/"), "%2f", "/"))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =Round(28 * UI, 0)
                              RadiusBottomRight: =Round(28 * UI, 0)
                              RadiusTopLeft: =Round(28 * UI, 0)
                              RadiusTopRight: =Round(28 * UI, 0)
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
      - pdfRule_Rv:
          Control: PDFViewer@2.5.0
          Properties:
            Document: =varRulePdf
            Height: =App.Height - Round(95 * UI, 0) - Round(84 * UI, 0)
            Visible: =!varRvLoading && !varRuleFail
            Width: =App.Width
            Y: =Round(95 * UI, 0)
