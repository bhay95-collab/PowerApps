                  - conEnd_Hm:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Round(16 * UI, 0)
                        LayoutMinHeight: =Round(16 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
      - btnSync_Hm:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =// UPLOAD: ideas saved on this phone while offline (one at a time; a failed one stays in the queue)
              If(
                  Connection.Connected && CountRows(colQueue) > 0,
                  Set(varSyncing, true);
                  ClearCollect(colSynced, { QID: "" });
                  Clear(colSynced);
                  ForAll(
                      colQueue As q,
                      With(
                          {
                              r: IfError(
                                  Patch(
                                      Floorwalk_Ideas,
                                      Defaults(Floorwalk_Ideas),
                                      {
                                      Title: q.Title,
                                      Idea: q.Idea,
                                      Service: q.Service,
                                      ServiceLine: q.ServiceLine,
                                      Stream: q.Stream,
                                      Location: q.Location,
                                      Module: q.Module,
                                      StakeholderName: q.StakeholderName,
                                      StakeholderEmail: q.StakeholderEmail,
                                      StakeholderJobTitle: q.StakeholderJobTitle,
                                      StakeholderDept: q.StakeholderDept,
                                      FollowUp: q.FollowUp,
                                      Theme: q.Theme,
                                      ThemeOther: q.ThemeOther,
                                      Priority: q.Priority,
                                      SafetyConcern: q.SafetyConcern,
                                      Status: q.Status,
                                      Votes: q.Votes
                                  }
                                  ),
                                  Blank()
                              )
                          },
                          If(
                              !IsBlank(r.ID),
                              If(!IsBlank(q.Photo) && IsError(Patch(Floorwalk_Ideas, r, { Photo: q.Photo })), Notify("An idea uploaded without its photo.", NotificationType.Warning));
                              If(q.SafetyConcern = "Yes", If(
                  !IsBlank(SafetyAlertTo),
                  IfError(
                      Office365Outlook.SendEmailV2(
                          SafetyAlertTo,
                          "Patient safety concern: " & q.Title,
                          Substitute(Substitute(EmailHead, "{{TITLE}}", "Patient Safety Concern"), "{{SUB}}", Coalesce(q.Service, "No service recorded")) &
                          "<tr><td style='padding:24px 32px 8px 32px;font-size:15px;line-height:22px;color:#3A5068;'>A floorwalker flagged an idea as a possible patient safety concern. Please check a RiskMan has been logged.</td></tr>" &
                          "<tr><td style='padding:8px 32px 24px 32px;'><table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='font-size:14px;'>" &
                              "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>SUMMARY</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(q.Title, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                              "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>DETAIL</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(q.Idea, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                              "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>SERVICE</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(q.Service, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                              "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>LOCATION</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(q.Location, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                              "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>IEMR AREA</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(q.Module, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                              "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>STAKEHOLDER</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(q.StakeholderName, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                              "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>PRIORITY</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(q.Priority, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                              "<tr><td style='padding:6px 0;color:#8C9BAE;font-size:12px;font-weight:700;width:120px;vertical-align:top;'>FLOORWALKER</td><td style='padding:6px 0;color:#0E1C2A;'>" & Substitute(Substitute(Coalesce(MeName, ""), "<", "&lt;"), ">", "&gt;") & "</td></tr>" &
                          "</table></td></tr>" &
                          Substitute(EmailFoot, "{{NOTE}}", "Raised in the Floorwalking Ideas app."),
                          { Importance: "High" }
                      ),
                      Notify("Saved, but the safety email could not be sent. Tell the CITTA lead directly.", NotificationType.Warning)
                  )
              ));
                              Collect(colSynced, { QID: q.QID })
                          )
                      )
                  );
                  RemoveIf(colQueue, QID in colSynced.QID);
                  IfError(SaveData(colQueue, "fwQueue"), false);
                  Set(varSyncing, false);
                  If(
                      CountRows(colQueue) = 0,
                      Notify(CountRows(colSynced) & If(CountRows(colSynced) = 1, " idea", " ideas") & " uploaded.", NotificationType.Success),
                      Notify(CountRows(colQueue) & " could not upload yet. Try again with better signal.", NotificationType.Warning)
                  );
                  Refresh(Floorwalk_Ideas);
                  ClearCollect(colMine_Hm, Filter(Floorwalk_Ideas, 'Created By'.Email = User().Email));
                  Set(varHmMineAllN, CountRows(colMine_Hm))
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(11 * UI, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
