                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(30 * UI, 0)
                                    Icon: ="Person"
                                    IconColor: =C_Amber
                                    IconStyle: =IconStyle.Filled
                                    Width: =Round(30 * UI, 0)
                                    X: =Round(13 * UI, 0)
                                    Y: =Round(13 * UI, 0)
                        - lblTileTMine_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(26 * UI, 0)
                              Size: =Round(15 * UI, 0)
                              Text: ="My Ideas"
                              Width: =Parent.Width - Round(130 * UI, 0)
                              Wrap: =false
                              X: =Round(88 * UI, 0)
                              Y: =Round(18 * UI, 0)
                        - lblTileSMine_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: =varHmMineAllN & If(varHmMineAllN = 1, " idea", " ideas") & " captured by you"
                              Width: =Parent.Width - Round(130 * UI, 0)
                              Wrap: =false
                              X: =Round(88 * UI, 0)
                              Y: =Round(46 * UI, 0)
                        - icoTileGoMine_Hm:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(24 * UI, 0)
                              Icon: ="ChevronRight"
                              IconColor: =C_Muted
                              Width: =Round(24 * UI, 0)
                              X: =Parent.Width - Round(38 * UI, 0)
                              Y: =Round(33 * UI, 0)
                        - btnTileMine_Hm:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: |-
                                =Set(varDashMine, true);
                                Navigate(Dashboard, ScreenTransition.Cover)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
