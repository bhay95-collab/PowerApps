                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Visible: =!IsBlank(varKit)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - capQLoc_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(22 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="1  ·  LOCATION"
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(14 * UI, 0)
                        - lblQLoc_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(28 * UI, 0)
                              Size: =Round(13 * UI, 0)
                              Text: ="Is the kit at the location above?"
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(38 * UI, 0)
                        - conYes_QLoc:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(varKitLoc = "Yes", RGBA(30, 122, 80, 1), C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varKitLoc = "Yes", RGBA(30, 122, 80, 1), C_White)
                              Height: =Round(48 * UI, 0)
                              RadiusBottomLeft: =Round(24 * UI, 0)
                              RadiusBottomRight: =Round(24 * UI, 0)
                              RadiusTopLeft: =Round(24 * UI, 0)
                              RadiusTopRight: =Round(24 * UI, 0)
                              Width: =Round((Parent.Width - Round(36 * UI, 0) - Round(12 * UI, 0)) / 2, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(74 * UI, 0)
                            Children:
                              - btnYes_QLoc:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
