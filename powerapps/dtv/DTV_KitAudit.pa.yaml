Screens:
  KitAudit:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =Set(varSaving, false);
        Set(varKitNoKitAsk, false);
        Set(varKit, Blank());
        Set(varKitLoc, Blank());
        Set(varKitSeal, Blank());
        Set(varKitStaff, Blank());
        Clear(colKitExp);
        Clear(colKitExtra);
        Reset(txtKitID_Kit);
        Reset(txtNotes_Kit);
        Reset(addPhoto_Kit);
        // the item catalogue (81 rows) is loaded once
        If(IsEmpty(colKitItems), ClearCollect(colKitItems, Kit_Items))
    Children:
      - conRoot_Kit:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Kit:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Kit:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Kit:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =If(varKitMode = "DTV", Notify("The DTV audit is saved. Finish the kit, or tap No Kit at This DTV.", NotificationType.Information), Navigate(Home, ScreenTransition.UnCoverRight))
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(24 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Kit:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(42 * UI, 0)
                        Size: =Round(19 * UI, 0)
                        Text: =If(varKitMode = "DTV", "Kit Audit", "Kit Only Audit")
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(12 * UI, 0)
                  - lblHdrS_Kit:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Font: =AppFont
                        Height: =Round(25 * UI, 0)
                        Size: =Round(12 * UI, 0)
                        Text: =If(varKitMode = "DTV", "Step 2 of 2  ·  " & varDTV.Department, If(IsBlank(varKit), "Scan the kit to start", varKit.Title))
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(53 * UI, 0)
            - conBody_Kit:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =Round(12 * UI, 0)
                  LayoutMinHeight: =Round(250 * UI, 0)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =Round(0 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingTop: =Round(15 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conScanKit_Kit:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =C_Accent
                        FillPortions: =0
                        Height: =Round(110 * UI, 0)
                        LayoutMinHeight: =Round(110 * UI, 0)
                        RadiusBottomLeft: =Round(25 * UI, 0)
                        RadiusBottomRight: =Round(25 * UI, 0)
                        RadiusTopLeft: =Round(25 * UI, 0)
                        RadiusTopRight: =Round(25 * UI, 0)
                        Visible: =IsBlank(varKit)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conScanKit_KitIc:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 0.16)
                              Height: =Round(56 * UI, 0)
                              RadiusBottomLeft: =Round(28 * UI, 0)
                              RadiusBottomRight: =Round(28 * UI, 0)
                              RadiusTopLeft: =Round(28 * UI, 0)
                              RadiusTopRight: =Round(28 * UI, 0)
                              Width: =Round(56 * UI, 0)
                              X: =Round(20 * UI, 0)
                              Y: =(Round(110 * UI, 0) - Round(56 * UI, 0)) / 2
                            Children:
                              - icoconScanKit_Kit:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(30 * UI, 0)
                                    Icon: ="Camera"
                                    IconColor: =C_White
                                    IconStyle: =IconStyle.Filled
                                    Width: =Round(30 * UI, 0)
                                    X: =Round(13 * UI, 0)
                                    Y: =Round(13 * UI, 0)
                        - lblconScanKit_KitT:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_White
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(32 * UI, 0)
                              Size: =Round(19 * UI, 0)
                              Text: ="Scan Kit QR Code"
                              Width: =Parent.Width - Round(108 * UI, 0)
                              Wrap: =false
                              X: =Round(92 * UI, 0)
                              Y: =(Round(110 * UI, 0) - Round(56 * UI, 0)) / 2
                        - lblconScanKit_KitS:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 0.85)
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: ="On the label on the kit box"
                              Width: =Parent.Width - Round(108 * UI, 0)
                              Wrap: =false
                              X: =Round(92 * UI, 0)
                              Y: =(Round(110 * UI, 0) - Round(56 * UI, 0)) / 2 + Round(34 * UI, 0)
                        - scnKit_Kit:
                            Control: BarcodeReader@1.0.25
                            Properties:
                              BorderStyle: =BorderStyle.None
                              FillColor: =RGBA(0, 0, 0, 0)
                              FontSize: =1
                              Height: =Parent.Height
                              HoverFillColor: =RGBA(255, 255, 255, 0.08)
                              OnScan: |-
                                =Set(varKitCode, Upper(Trim(First(scnKit_Kit.Barcodes).Value)));
                                Select(btnLoadKit_Kit)
                              ScanningMode: ='BarcodeReader.ScanningMode'.SelectToScan
                              Text: =""
                              Width: =Parent.Width
                  - conTypeKit_Kit:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(118 * UI, 0)
                        LayoutMinHeight: =Round(118 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Visible: =IsBlank(varKit)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - capTypeKit_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(22 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="OR TYPE THE KIT ID"
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(14 * UI, 0)
                        - txtKitID_Kit:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(14, 42, 70, 0.22)
                              BorderThickness: =1
                              Color: =C_Ink
                              Default: =""
                              FocusedBorderColor: =C_Accent
                              FocusedBorderThickness: =2
                              Font: =AppFont
                              Height: =Round(52 * UI, 0)
                              HintText: ="e.g. DTK-014"
                              RadiusBottomLeft: =Round(12 * UI, 0)
                              RadiusBottomRight: =Round(12 * UI, 0)
                              RadiusTopLeft: =Round(12 * UI, 0)
                              RadiusTopRight: =Round(12 * UI, 0)
                              Size: =Round(13 * UI, 0)
                              Width: =Parent.Width - Round(36 * UI, 0) - Round(110 * UI, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(48 * UI, 0)
                        - conGo_Kit:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =C_Accent
                              Height: =Round(52 * UI, 0)
                              RadiusBottomLeft: =Round(26 * UI, 0)
                              RadiusBottomRight: =Round(26 * UI, 0)
                              RadiusTopLeft: =Round(26 * UI, 0)
                              RadiusTopRight: =Round(26 * UI, 0)
                              Width: =Round(98 * UI, 0)
                              X: =Parent.Width - Round(18 * UI, 0) - Round(98 * UI, 0)
                              Y: =Round(48 * UI, 0)
                            Children:
                              - btnGo_Kit:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =C_White
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varKitCode, Upper(Trim(txtKitID_Kit.Text)));
                                      Select(btnLoadKit_Kit)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(26 * UI, 0)
                                    RadiusBottomRight: =Round(26 * UI, 0)
                                    RadiusTopLeft: =Round(26 * UI, 0)
                                    RadiusTopRight: =Round(26 * UI, 0)
                                    Size: =Round(12 * UI, 0)
                                    Text: ="Open"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                  - conNoKit_Kit:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(178, 105, 0, 0.35)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_AmberBg
                        FillPortions: =0
                        Height: =Round(90 * UI, 0)
                        LayoutMinHeight: =Round(90 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Visible: =IsBlank(varKit) && varKitMode = "DTV"
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - lblNoKitT_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Amber
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(28 * UI, 0)
                              Size: =Round(15 * UI, 0)
                              Text: ="No Kit at This DTV"
                              Width: =Parent.Width - Round(80 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(16 * UI, 0)
                        - lblNoKitS_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Amber
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: ="Records the kit as not found"
                              Width: =Parent.Width - Round(80 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(48 * UI, 0)
                        - icoNoKit_Kit:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(24 * UI, 0)
                              Icon: ="ChevronRight"
                              IconColor: =C_Amber
                              Width: =Round(24 * UI, 0)
                              X: =Parent.Width - Round(40 * UI, 0)
                              Y: =Round(33 * UI, 0)
                        - btnNoKit_Kit:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              DisplayMode: =If(varSaving, DisplayMode.Disabled, DisplayMode.Edit)
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: =If(varKitNoKitAsk, Select(btnSaveNoKit_Kit), Set(varKitNoKitAsk, true); Notify("Tap again to confirm there is no kit here.", NotificationType.Warning))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                  - conKitInfo_Kit:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(150 * UI, 0)
                        LayoutMinHeight: =Round(150 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Visible: =!IsBlank(varKit)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - capKitInfo_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(22 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="KIT  ·  " & varKit.Title
                              Width: =Parent.Width - Round(140 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(14 * UI, 0)
                        - lblChange_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =C_Accent
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(30 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: ="Change Kit"
                              Width: =Round(112 * UI, 0)
                              Wrap: =false
                              X: =Parent.Width - Round(130 * UI, 0)
                              Y: =Round(10 * UI, 0)
                        - btnChange_Kit:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              FontWeight: =""
                              Height: =Round(40 * UI, 0)
                              OnSelect: |-
                                =Set(varKit, Blank());
                                Clear(colKitExp);
                                Clear(colKitExtra);
                                Reset(txtKitID_Kit)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Round(136 * UI, 0)
                              X: =Parent.Width - Round(140 * UI, 0)
                              Y: =Round(4 * UI, 0)
                        - lblKitUnit_Kit:
