                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(14 * UI, 0)
                        - conAddPhoto_Kit:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =C_Accent
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =C_White
                              Height: =Round(48 * UI, 0)
                              RadiusBottomLeft: =Round(24 * UI, 0)
                              RadiusBottomRight: =Round(24 * UI, 0)
                              RadiusTopLeft: =Round(24 * UI, 0)
                              RadiusTopRight: =Round(24 * UI, 0)
                              Width: =Parent.Width - Round(36 * UI, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(44 * UI, 0)
                            Children:
                              - lblAddPhoto_Kit:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =C_Accent
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(48 * UI, 0)
                                    Size: =Round(12 * UI, 0)
                                    Text: =If(IsBlank(addPhoto_Kit.Media), "Add Photo", "Change Photo")
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                                    Wrap: =false
                        - addPhoto_Kit:
                            Control: AddMedia@2.2.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Segoe UI'
                              Height: =Round(48 * UI, 0)
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Size: =Round(12 * UI, 0)
                              Width: =Parent.Width - Round(36 * UI, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(44 * UI, 0)
                        - imgPhoto_Kit:
                            Control: Image@2.2.3
                            Properties:
                              Height: =Round(110 * UI, 0)
                              Image: =addPhoto_Kit.Media
                              ImagePosition: =ImagePosition.Fit
                              Visible: =!IsBlank(addPhoto_Kit.Media)
                              Width: =Round(110 * UI, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(104 * UI, 0)
                        - lblRemovePhoto_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(176, 52, 40, 1)
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(26 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: ="Remove Photo"
                              Visible: =!IsBlank(addPhoto_Kit.Media)
                              Width: =Parent.Width - Round(36 * UI, 0) - Round(126 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0) + Round(126 * UI, 0)
                              Y: =Round(146 * UI, 0)
                        - btnRemovePhoto_Kit:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              FontWeight: =""
                              Height: =Round(46 * UI, 0)
                              OnSelect: =Reset(addPhoto_Kit)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - Round(36 * UI, 0) - Round(116 * UI, 0)
                              X: =Round(18 * UI, 0) + Round(116 * UI, 0)
                              Y: =Round(136 * UI, 0)
                        - txtNotes_Kit:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =C_Line
                              BorderThickness: =1
                              Color: =C_Ink
                              Default: =""
                              FocusedBorderColor: =C_Accent
                              FocusedBorderThickness: =2
                              Font: =AppFont
                              Height: =Round(140 * UI, 0)
                              HintText: ="Anything else about this kit (optional)"
                              Mode: =TextMode.MultiLine
                              RadiusBottomLeft: =Round(12 * UI, 0)
                              RadiusBottomRight: =Round(12 * UI, 0)
                              RadiusTopLeft: =Round(12 * UI, 0)
                              RadiusTopRight: =Round(12 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Width: =Parent.Width - Round(36 * UI, 0)
                              X: =Round(18 * UI, 0)
                              Y: =Round(If(IsBlank(addPhoto_Kit.Media), 104, 226) * UI, 0)
                  - conEnd_Kit:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Round(16 * UI, 0)
                        LayoutMinHeight: =Round(16 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
            - conFoot_Kit:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =C_Line
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =C_White
                  FillPortions: =0
                  Height: =Round(84 * UI, 0)
                  LayoutMinHeight: =Round(84 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conSubmit_Kit:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(btnSubmit_Kit.DisplayMode = DisplayMode.Edit, C_Accent, RGBA(160, 174, 180, 1))
                        Height: =Round(60 * UI, 0)
                        RadiusBottomLeft: =Round(28 * UI, 0)
                        RadiusBottomRight: =Round(28 * UI, 0)
                        RadiusTopLeft: =Round(28 * UI, 0)
                        RadiusTopRight: =Round(28 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                        X: =Gutter + Round(20 * UI, 0)
                        Y: =Round(12 * UI, 0)
                      Children:
                        - lblSubmit_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =C_White
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(60 * UI, 0)
                              Size: =Round(14 * UI, 0)
                              Text: =If(btnSubmit_Kit.DisplayMode = DisplayMode.Edit, "Submit Kit Audit" & If(CountRows(Filter(colKitExp, !Present)) + CountRows(colKitExtra) > 0, "  ·  " & CountRows(Filter(colKitExp, !Present)) & " missing, " & CountRows(colKitExtra) & " extra", ""), If(IsBlank(varKit), "Scan the kit first", "Answer questions 1 to 3 to submit"))
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                              Wrap: =false
                        - btnSubmit_Kit:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              DisplayMode: =If(!IsBlank(varKit) && !IsBlank(varKitLoc) && !IsBlank(varKitSeal) && !IsBlank(varKitStaff) && !varSaving, DisplayMode.Edit, DisplayMode.Disabled)
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: |-
                                =Set(varSaving, true);
                                With(
                                    {
                                        miss: Filter(colKitExp, !Present),
                                        nMiss: CountRows(Filter(colKitExp, !Present)),
                                        nExtra: CountRows(colKitExtra)
                                    },
                                    With(
                                        {
                                            clear: nMiss + nExtra = 0 && varKitLoc = "Yes" && varKitSeal = "Yes" && varKitStaff = "Yes",
                                            rec: Patch(
                                                Kit_Audits,
                                                Defaults(Kit_Audits),
                                                {
                                                    Title: varKit.Title,
                                                    Unit: varKit.Unit,
                                                    KitLocation: varKit.Location,
                                                    KitType: varKit.KitType,
                                                    AuditType: If(varKitMode = "DTV", "DTV + Kit", "Kit Only"),
                                                    DTVTitle: If(varKitMode = "DTV", varDTV.Title, ""),
                                                    AuditResultID: If(varKitMode = "DTV", varLastAudit.ID, Blank()),
                                                    RightLocation: varKitLoc,
                                                    SealIntact: varKitSeal,
                                                    StaffAware: varKitStaff,
                                                    ExpectedN: CountRows(colKitExp),
                                                    MissingN: nMiss,
                                                    ExtraN: nExtra,
                                                    MissingItems: Concat(miss, Name, "; "),
                                                    ExtraItems: Concat(colKitExtra, Name & " (" & Value & ")", "; "),
                                                    Notes: Trim(txtNotes_Kit.Text)
                                                }
                                            )
                                        },
                                        If(
                                            IsEmpty(Errors(Kit_Audits)),
                                            Patch(Kit_Audits, rec, { Result: If(clear, "All Clear", "Needs Follow-up") });
                                            // exceptions only: one row per missing item and per extra barcode
                                            ForAll(
                                                miss As m,
                                                Patch(Kit_Audit_Items, Defaults(Kit_Audit_Items), { Title: varKit.Title, KitAuditID: rec.ID, ItemKey: m.ItemKey, ItemName: m.Name, Status: "Missing", ScannedValue: "" })
                                            );
                                            ForAll(
                                                colKitExtra As x,
                                                Patch(Kit_Audit_Items, Defaults(Kit_Audit_Items), { Title: varKit.Title, KitAuditID: rec.ID, ItemKey: "", ItemName: x.Name, Status: "Extra", ScannedValue: x.Value })
                                            );
                                            If(!IsBlank(addPhoto_Kit.Media), Patch(Kit_Audits, rec, { KitPhoto: imgPhoto_Kit.Image }));
                                            // DTV + Kit: write the kit result onto the DTV audit so the Dashboard keeps working
                                            If(
                                                varKitMode = "DTV" && !IsBlank(varLastAudit),
                                                Set(
                                                    varLastAudit,
                                                    Patch(
                                                        Audit_Results,
                                                        LookUp(Audit_Results, ID = varLastAudit.ID),
                                                        {
                                                            FolderFound: { Value: "Yes" },
                                                            ContentsListInFolder: { Value: "Yes" },
                                                            KitMatched: { Value: If(nMiss + nExtra = 0, "Yes", "No") },
                                                            MissingItems: Concat(miss, Name, "; "),
                                                            ExtraItems: Concat(colKitExtra, Name & " (" & Value & ")", "; ")
                                                        }
                                                    )
                                                )
                                            );
                                            If(
                                                !IsEmpty(Errors(Kit_Audit_Items)),
                                                Notify("Kit audit saved, but some item rows could not be saved.", NotificationType.Warning)
                                            );
                                            Set(varKitLast, { KitID: varKit.Title, Unit: varKit.Unit, Missing: nMiss, Extra: nExtra, Clear: clear });
                                            Set(varSaving, false);
                                            If(varKitMode = "DTV", Navigate(Done, ScreenTransition.Cover), Navigate(KitDone, ScreenTransition.Cover)),
                                            Set(varSaving, false);
                                            Notify("Could not save the kit audit. Check your connection and try again.", NotificationType.Error)
                                        )
                                    )
                                )
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
      - btnLoadKit_Kit:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =If(IsEmpty(colKitItems), ClearCollect(colKitItems, Kit_Items));
              Set(varKit, LookUp(Kit_Register, Title = varKitCode));
              If(
                  IsBlank(varKit),
                  Notify("Kit " & varKitCode & " is not in the kit register. Check the label or type the kit ID.", NotificationType.Error),
                  ClearCollect(
                      colKitExp,
                      ForAll(
                          Filter(Kit_Contents, Title = varKit.Title) As c,
                          With(
                              { i: LookUp(colKitItems, Title = c.ItemKey) },
                              {
                                  ItemKey: c.ItemKey,
                                  Name: Coalesce(i.ItemName, c.ItemKey),
                                  Barcode: Upper(Coalesce(i.BarcodeValue, "")),
                                  Scan: i.ScanMethod = "Scan barcode" && !IsBlank(i.BarcodeValue),
                                  Present: false,
                                  Sections: c.Sections
                              }
                          )
                      )
                  );
                  Clear(colKitExtra);
                  Set(varKitLoc, Blank());
                  Set(varKitSeal, Blank());
                  Set(varKitStaff, Blank())
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(11 * UI, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnSaveNoKit_Kit:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =Set(varSaving, true);
              Set(varKitNoKitAsk, false);
              Patch(
                  Kit_Audits,
                  Defaults(Kit_Audits),
                  {
                      Title: "NO KIT",
                      AuditType: "DTV + Kit",
                      DTVTitle: varDTV.Title,
                      AuditResultID: varLastAudit.ID,
                      Result: "Kit not found",
                      Notes: "No kit found at this DTV"
                  }
              );
              If(
                  !IsBlank(varLastAudit),
                  Set(varLastAudit, Patch(Audit_Results, LookUp(Audit_Results, ID = varLastAudit.ID), { FolderFound: { Value: "No" } }))
              );
              Set(varSaving, false);
              Navigate(Done, ScreenTransition.Cover)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(11 * UI, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
