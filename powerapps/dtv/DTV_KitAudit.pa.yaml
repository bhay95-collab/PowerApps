                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(30 * UI, 0)
                              Size: =Round(15 * UI, 0)
                              Text: =varKit.Unit
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(38 * UI, 0)
                        - lblKitLoc_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink2
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: =varKit.Location
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(68 * UI, 0)
                        - lblKitType_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Accent
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(22 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: =varKit.KitType
                              Width: =Parent.Width - Round(36 * UI, 0)
                              Wrap: =false
                              X: =Round(18 * UI, 0)
                              Y: =Round(92 * UI, 0)
                        - lblKitDTV_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              Height: =Round(22 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: |-
                                ="Auditing with DTV: " & varDTV.Department & " · " & varDTV.DTVLocation
