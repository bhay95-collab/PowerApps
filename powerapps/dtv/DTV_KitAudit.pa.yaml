                              BorderColor: =If(varKitLoc = "No", RGBA(176, 52, 40, 1), C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varKitLoc = "No", RGBA(176, 52, 40, 1), C_White)
                              Height: =Round(48 * UI, 0)
                              RadiusBottomLeft: =Round(24 * UI, 0)
                              RadiusBottomRight: =Round(24 * UI, 0)
                              RadiusTopLeft: =Round(24 * UI, 0)
                              RadiusTopRight: =Round(24 * UI, 0)
                              Width: =Round((Parent.Width - Round(36 * UI, 0) - Round(12 * UI, 0)) / 2, 0)
                              X: =Round(18 * UI, 0) + Round((Parent.Width - Round(36 * UI, 0) - Round(12 * UI, 0)) / 2, 0) + Round(12 * UI, 0)
