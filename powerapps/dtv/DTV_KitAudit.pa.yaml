                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(If(IsBlank(addPhoto_Kit.Media), 268, 390) * UI, 0)
                        LayoutMinHeight: =Round(If(IsBlank(addPhoto_Kit.Media), 268, 390) * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Visible: =!IsBlank(varKit)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - capPhoto_Kit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
