                            Children:
                              - btnNo_QLoc:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(varKitLoc = "No", C_White, C_Muted)
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    OnSelect: =Set(varKitLoc, "No")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(24 * UI, 0)
                                    RadiusBottomRight: =Round(24 * UI, 0)
                                    RadiusTopLeft: =Round(24 * UI, 0)
                                    RadiusTopRight: =Round(24 * UI, 0)
                                    Size: =Round(12 * UI, 0)
