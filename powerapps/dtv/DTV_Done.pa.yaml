Screens:
  Done:
    Properties:
      Fill: =C_Bg
    Children:
      - conRoot_Dn:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Dn:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Dn:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Dn:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =Navigate(Home, ScreenTransition.UnCoverRight)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(24 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Dn:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(42 * UI, 0)
                        Size: =Round(19 * UI, 0)
                        Text: =If(varReaudit, "Re-audit Saved", "Audit Saved")
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(12 * UI, 0)
                  - lblHdrS_Dn:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Font: =AppFont
                        Height: =Round(25 * UI, 0)
                        Size: =Round(12 * UI, 0)
                        Text: =varDTV.Department
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(53 * UI, 0)
            - conBody_Dn:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =Round(12 * UI, 0)
                  LayoutMinHeight: =Round(250 * UI, 0)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =Round(30 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingTop: =Round(18 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conOk_Dn:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(150 * UI, 0)
                        LayoutMinHeight: =Round(150 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conOkIc_Dn:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =C_AccentSoft
                              Height: =Round(70 * UI, 0)
                              RadiusBottomLeft: =Round(35 * UI, 0)
                              RadiusBottomRight: =Round(35 * UI, 0)
                              RadiusTopLeft: =Round(35 * UI, 0)
                              RadiusTopRight: =Round(35 * UI, 0)
                              Width: =Round(70 * UI, 0)
                              X: =Round(25 * UI, 0)
                              Y: =Round(20 * UI, 0)
                            Children:
                              - icoOk_Dn:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(45 * UI, 0)
                                    Icon: ="CheckmarkCircle"
                                    IconColor: =C_Accent
                                    IconStyle: =IconStyle.Filled
                                    Width: =Round(45 * UI, 0)
                                    X: =Round(12 * UI, 0)
                                    Y: =Round(12 * UI, 0)
                        - lblOkT_Dn:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(35 * UI, 0)
                              Size: =Round(18 * UI, 0)
                              Text: ="Thank You"
                              Width: =Parent.Width - Round(135 * UI, 0)
                              Wrap: =false
                              X: =Round(115 * UI, 0)
                              Y: =Round(21 * UI, 0)
                        - lblOkS_Dn:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              Height: =Round(40 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: =varDTV.DisplayName
                              Width: =Parent.Width - Round(135 * UI, 0)
                              X: =Round(115 * UI, 0)
                              Y: =Round(56 * UI, 0)
                        - lnOk_Dn:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =C_Line
                              Height: =1
                              Width: =Parent.Width - Round(50 * UI, 0)
                              X: =Round(25 * UI, 0)
                              Y: =Round(104 * UI, 0)
                        - lblOkR_Dn:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink2
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(24 * UI, 0)
                              Size: =Round(11 * UI, 0)
                              Text: =If(varLastAudit.DTVFound.Value = "No", "DTV not found", "Login " & varLastAudit.LoginWorked.Value & "  ·  Print " & varLastAudit.PrintWorked.Value) & "  ·  Kit " & If(varLastAudit.FolderFound.Value = "No", "not found", Coalesce(varLastAudit.KitMatched.Value, "no list"))
                              Width: =Parent.Width - Round(50 * UI, 0)
                              Wrap: =false
                              X: =Round(25 * UI, 0)
                              Y: =Round(114 * UI, 0)
                  - conNext_Dn:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =C_Accent
                        FillPortions: =0
                        Height: =Round(100 * UI, 0)
                        LayoutMinHeight: =Round(100 * UI, 0)
                        RadiusBottomLeft: =Round(25 * UI, 0)
                        RadiusBottomRight: =Round(25 * UI, 0)
                        RadiusTopLeft: =Round(25 * UI, 0)
                        RadiusTopRight: =Round(25 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - lblNextT_Dn:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_White
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(35 * UI, 0)
                              Size: =Round(18 * UI, 0)
                              Text: =If(varReaudit, "Re-audit Another DTV", "Audit Another DTV")
                              Width: =Parent.Width - Round(40 * UI, 0)
                              Wrap: =false
                              X: =Round(25 * UI, 0)
                              Y: =Round(22 * UI, 0)
                        - lblNextS_Dn:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 0.85)
                              Font: =AppFont
                              Height: =Round(25 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: ="Back to the list"
                              Width: =Parent.Width - Round(40 * UI, 0)
                              Wrap: =false
                              X: =Round(25 * UI, 0)
                              Y: =Round(60 * UI, 0)
                        - btnNext_Dn:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: =If(varReaudit, Navigate(ReAuditList, ScreenTransition.UnCoverRight), Navigate(SelectDTV, ScreenTransition.UnCoverRight))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
                  - conHome_Dn:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(80 * UI, 0)
                        LayoutMinHeight: =Round(80 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - lblHomeT_Dn:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(80 * UI, 0)
                              Size: =Round(15 * UI, 0)
                              Text: ="Home"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - Round(80 * UI, 0)
                              Wrap: =false
                              X: =Round(25 * UI, 0)
                        - icoHomeGo_Dn:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(30 * UI, 0)
                              Icon: ="ChevronRight"
                              IconColor: =C_Muted
                              Width: =Round(30 * UI, 0)
                              X: =Parent.Width - Round(45 * UI, 0)
                              Y: =Round(25 * UI, 0)
                        - btnHome_Dn:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              BorderStyle: =BorderStyle.None
                              FontWeight: =""
                              Height: =Parent.Height
                              OnSelect: =Navigate(Home, ScreenTransition.UnCoverRight)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
