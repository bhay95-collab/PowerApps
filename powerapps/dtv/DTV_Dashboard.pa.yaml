      - btnLoad_Dsh:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =// LOAD: every audit, flattened to plain text columns (one row per DTV, latest audit)
              Set(varDashLoading, true);
              Refresh(Audit_Results);
              ClearCollect(colDashReg, DTV_Register);
              // newest first, so LookUp below returns each DTV's latest audit
              ClearCollect(colDashSrc, SortByColumns(Audit_Results, "Created", SortOrder.Descending));
              // FINAL STATE: one row per DTV = its latest audit (earlier audits and re-audits are replaced)
              ClearCollect(
                  colDashRows,
                  ForAll(
                      Distinct(colDashSrc, Title) As u,
                      With(
                          {
                              a: LookUp(colDashSrc, Title = u.Value),
                              f: Last(Filter(colDashSrc, Title = u.Value)),
                              cnt: CountIf(colDashSrc, Title = u.Value)
                          },
                      With(
                          {
                              d: LookUp(colDashReg, Title = a.Title),
                              fails: If(
                                  a.DTVFound.Value = "No",
                                  "DTV not found",
                                  Concat(
                                      Filter(
                                          Table(
                                              { p: If(a.LoginWorked.Value = "No", "Login", "") },
                                              { p: If(a.PatientListWorked.Value = "No", "Patient list", "") },
                                              { p: If(a.PrintWorked.Value = "No", "Print", "") },
                                              { p: If(a.FolderFound.Value = "No", "Kit not found", "") },
                                              { p: If(a.ContentsListInFolder.Value = "No", "No contents list", "") },
                                              { p: If(a.KitMatched.Value = "No", "Kit mismatch", "") }
                                          ),
                                          p <> ""
                                      ),
                                      p,
                                      " · "
                                  )
                              )
                          },
                          {
                              AID: a.ID,
                              Title: a.Title,
                              Dept: Coalesce(d.Department, a.DisplayName, a.Title),
                              Loc: Coalesce(d.DTVLocation, ""),
                              Stream: Coalesce(a.Stream, d.Stream, ""),
                              When: a.Created,
                              Auditor: a.'Created By'.DisplayName,
                              FoundRes: a.DTVFound.Value,
                              LoginRes: a.LoginWorked.Value,
                              LoginWhy: a.LoginFailReason.Value,
                              LoginNotes: a.LoginNotes,
                              PListRes: a.PatientListWorked.Value,
                              PrintRes: a.PrintWorked.Value,
                              PrintWhy: a.PrintFailReason.Value,
                              PrintNotes: a.PrintNotes,
                              FolderRes: a.FolderFound.Value,
                              ListRes: a.ContentsListInFolder.Value,
                              MatchRes: a.KitMatched.Value,
                              Missing: a.MissingItems,
                              Extra: a.ExtraItems,
                              Spoke: a.SpokeTo,
                              Edu: Concat(a.EducationGiven, Value, "; "),
                              Issues: a.IssuesRaised,
                              Notes: a.Notes,
                              ReAudit: !IsBlank(a.ReAudit),
                              Fails: fails,
                              Follow: !IsBlank(fails),
                              AuditN: cnt,
                              // first audit vs latest: Waiting = failed, no re-audit yet; Still = failed both; Fixed = failed then clear; New = clear then failed
                              Stage: With(
                                  {
                                      firstFail: f.DTVFound.Value = "No" || f.LoginWorked.Value = "No" || f.PatientListWorked.Value = "No" || f.PrintWorked.Value = "No"
                                          || f.FolderFound.Value = "No" || f.ContentsListInFolder.Value = "No" || f.KitMatched.Value = "No"
                                  },
                                  If(
                                      cnt > 1,
                                      If(firstFail, If(IsBlank(fails), "Fixed", "Still"), If(IsBlank(fails), "Clear", "New")),
                                      If(IsBlank(fails), "Clear", "Waiting")
                                  )
                              )
                          }
                      )
                      )
                  )
              );
              Clear(colDashSrc);
              // coverage by stream (ignores the stream filter): shared DTVs (Stream = "All") count in every stream
              ClearCollect(
                  colDashCov,
                  ForAll(
                      Filter(Distinct(colDashReg, Stream), !IsBlank(Value) && Value <> "All") As s,
                      With(
                          { tot: Filter(colDashReg, Stream = s.Value || Stream = "All") },
                          {
                              Stream: s.Value,
                              Short: Trim(First(Split(Substitute(s.Value, ",", "&"), "&")).Value),
                              Total: CountRows(tot),
                              Done: CountRows(Filter(tot, Title in colDashRows.Title))
                          }
                      )
                  )
              );
              Set(varDashLoading, false);
              Select(btnCalc_Dsh)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(11 * UI, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnCalc_Dsh:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =// CALC: apply the stream filter, then every number and chart on the screen
              ClearCollect(colDash, Filter(colDashRows, varDashStream = "ALL" || Stream = varDashStream || Stream = "All"));
              Set(varDashN, CountRows(colDash));
              Set(varDashFollowN, CountIf(colDash, Follow));
              Set(varDashClearN, varDashN - varDashFollowN);
              Set(varDashNotFoundN, CountIf(colDash, FoundRes = "No"));
              ClearCollect(colDashRegS, Filter(colDashReg, varDashStream = "ALL" || Stream = varDashStream || Stream = "All"));
              Set(varDashRegN, CountRows(colDashRegS));
              Set(varDashCovN, CountRows(Filter(colDashRegS, Title in colDash.Title)));
              ClearCollect(
                  colDashChecks,
                  { Key: "Found", Label: "DTV Found", Yes: CountIf(colDash, FoundRes = "Yes"), No: CountIf(colDash, FoundRes = "No") },
                  { Key: "Login", Label: "Login", Yes: CountIf(colDash, LoginRes = "Yes"), No: CountIf(colDash, LoginRes = "No") },
                  { Key: "PList", Label: "Patient List", Yes: CountIf(colDash, PListRes = "Yes"), No: CountIf(colDash, PListRes = "No") },
                  { Key: "Print", Label: "Print", Yes: CountIf(colDash, PrintRes = "Yes"), No: CountIf(colDash, PrintRes = "No") },
                  { Key: "Folder", Label: "Folder and Kit Found", Yes: CountIf(colDash, FolderRes = "Yes"), No: CountIf(colDash, FolderRes = "No") },
                  { Key: "List", Label: "Contents List", Yes: CountIf(colDash, ListRes = "Yes"), No: CountIf(colDash, ListRes = "No") },
                  { Key: "Match", Label: "Kit Matches List", Yes: CountIf(colDash, MatchRes = "Yes"), No: CountIf(colDash, MatchRes = "No") }
              );
              ClearCollect(
                  colDashWhy,
                  ForAll(
                      Table(
                          { K: "Print", R: "Printer offline or not found" },
                          { K: "Print", R: "No printer set up on DTV" },
                          { K: "Print", R: "Sent to print nothing came out" },
                          { K: "Print", R: "Printed on wrong printer" },
                          { K: "Print", R: "Error message (auditor types it)" },
                          { K: "Print", R: "Other (type it)" },
                          { K: "Login", R: "Password/Username is wrong" },
                          { K: "Login", R: "Unable to access DTV" },
                          { K: "Login", R: "Other" }
                      ) As t,
                      {
                          Kind: t.K,
                          Reason: t.R,
                          N: If(t.K = "Print", CountIf(colDash, PrintRes = "No" && PrintWhy = t.R), CountIf(colDash, LoginRes = "No" && LoginWhy = t.R))
                      }
                  )
              );
              Set(varDashMaxPrint, Max(Filter(colDashWhy, Kind = "Print"), N));
              Set(varDashMaxLogin, Max(Filter(colDashWhy, Kind = "Login"), N));
              ClearCollect(colDashEdu, ForAll(Table({ V: "Downtime Escalation Pathway" }, { V: "Downtime Process" }, { V: "Downtime Coordinator" }, { V: "Key's Location" }, { V: "DMN Resourcing Page" }) As e, { Item: e.V, N: CountIf(colDash, e.V in Edu) }));
              ClearCollect(
                  colDashStage,
                  { Key: "Waiting", Label: "Failed, not re-audited yet", N: CountIf(colDash, Stage = "Waiting") },
                  { Key: "Still", Label: "Still failing after re-audit", N: CountIf(colDash, Stage = "Still") },
                  { Key: "Fixed", Label: "Fixed on re-audit", N: CountIf(colDash, Stage = "Fixed") },
                  { Key: "New", Label: "New issue on re-audit", N: CountIf(colDash, Stage = "New") }
              );
              Set(varDashMaxStage, Max(colDashStage, N))
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(11 * UI, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnSend_Dsh:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =// EMAIL: branded summary + CSV of the final state of every DTV (latest audit each) in the chosen stream (sent by the flow DTVDashboardEmail)
              If(
                  varDashN = 0,
                  Notify("No DTVs audited yet.", NotificationType.Information),
                  Set(varSaving, true);
                  Set(varDashStreamLbl, If(varDashStream = "ALL", "All streams", varDashStream));
                  // ---- CSV (UTF-8 mark first so Excel shows names correctly)
                  Set(
                      varDashCsv,
                      UniChar(65279) & "Audit Date,Asset Tag,Department,Location,Stream,Auditor,Audits Done,Follow-up Status,Latest Was Re-audit,Result,Issues Summary,DTV Found,Login Worked,Login Fail Reason,Login Notes,Patient List Worked,Print Worked,Print Fail Reason,Print Notes,Folder and Kit Found,Contents List In Folder,Kit Matched,Missing Items,Extra Items,Spoke To,Education Given,Issues Raised,Notes" & Char(13) & Char(10) &
                      Concat(
                          SortByColumns(colDash, "When", SortOrder.Descending),
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Text(When, "yyyy-mm-dd hh:mm"), ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Title, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Dept, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Loc, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Stream, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Auditor, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Text(AuditN), ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Switch(Stage, "Waiting", "Failed, not re-audited yet", "Still", "Still failing after re-audit", "Fixed", "Fixed on re-audit", "New", "New issue on re-audit", "Clear"), ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(If(ReAudit, "Yes", "No"), ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(If(Follow, "Needs follow-up", "All clear"), ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Fails, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(FoundRes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(LoginRes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(LoginWhy, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(LoginNotes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(PListRes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(PrintRes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(PrintWhy, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(PrintNotes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(FolderRes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(ListRes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(MatchRes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Missing, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Extra, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Spoke, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Edu, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Issues, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34) & "," &
                          Char(34) & Substitute(Substitute(Substitute(Coalesce(Notes, ""), Char(34), Char(34) & Char(34)), Char(13), " "), Char(10), " ") & Char(34),
                          Char(13) & Char(10)
                      )
                  );
                  // ---- HTML summary
