                              "<div style='font-size:12px;color:#3A5068;padding-top:2px;'>" & "DTVs" & "</div>" &
                          "</td></tr></table></td>" &
                      "</tr></table></td></tr>" &
              
                      // results by check
                      "<tr><td style='padding:20px 32px 6px 32px;font-size:11px;letter-spacing:2px;font-weight:700;color:#8C9BAE;'>RESULTS BY CHECK</td></tr>" &
                      "<tr><td style='padding:6px 32px 8px 32px;'>" &
                      "<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" &
                          "<tr bgcolor='#F2F6FA' style='background-color:#F2F6FA;'>" &
                              "<th align='left' style='padding:10px 12px;font-size:11px;letter-spacing:1px;color:#8C9BAE;border-bottom:2px solid #1A5A99;border-radius:14px 0 0 0;'>CHECK</th>" &
                              "<th align='left' style='padding:10px 12px;font-size:11px;letter-spacing:1px;color:#8C9BAE;border-bottom:2px solid #1A5A99;'>PASSED / FAILED</th>" &
                              "<th align='right' style='padding:10px 12px;font-size:11px;letter-spacing:1px;color:#8C9BAE;border-bottom:2px solid #1A5A99;border-radius:0 14px 0 0;'>FAILED</th>" &
                          "</tr>" &
                          Concat(
                              colDashChecks,
                              With(
                                  { tot: Yes + No, pc: If(Yes + No > 0, Round(Yes * 100 / (Yes + No), 0), 0) },
                                  "<tr>" &
                                      "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;font-weight:600;color:#0E1C2A;'>" & Label & "</td>" &
                                      "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;' width='45%'>" &
                                          If(
                                              tot = 0,
                                              "<span style='color:#8C9BAE;'>Not checked</span>",
                                              "<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0'><tr>" &
                                                  If(pc > 0, "<td width='" & pc & "%' height='10' bgcolor='#1E7A50' style='background-color:#1E7A50;height:10px;font-size:0;line-height:0;'>&nbsp;</td>", "") &
                                                  If(pc < 100, "<td width='" & (100 - pc) & "%' height='10' bgcolor='#B03428' style='background-color:#B03428;height:10px;font-size:0;line-height:0;'>&nbsp;</td>", "") &
                                              "</tr></table>"
                                          ) &
                                      "</td>" &
                                      "<td align='right' style='padding:10px 12px;border-top:1px solid #E3EAF1;font-weight:700;color:" & If(No > 0, "#B03428", "#1E7A50") & ";'>" & No & " of " & tot & "</td>" &
                                  "</tr>"
                              )
                          ) &
                      "</table></td></tr>" &
              
                      // why it failed
                      If(
                          varDashMaxPrint + varDashMaxLogin > 0,
                          "<tr><td style='padding:20px 32px 6px 32px;font-size:11px;letter-spacing:2px;font-weight:700;color:#8C9BAE;'>WHY IT FAILED</td></tr>" &
                          "<tr><td style='padding:6px 32px 8px 32px;'>" &
                          "<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" &
                              Concat(
                                  Filter(colDashWhy, N > 0),
                                  "<tr>" &
                                      "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;color:#8C9BAE;font-size:12px;font-weight:700;' width='70'>" & Upper(Kind) & "</td>" &
                                      "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;color:#0E1C2A;'>" & Reason & "</td>" &
                                      "<td align='right' style='padding:10px 12px;border-top:1px solid #E3EAF1;font-weight:700;color:#B03428;'>" & N & "</td>" &
                                  "</tr>"
                              ) &
                          "</table></td></tr>",
                          ""
                      ) &
              
                      // follow-up progress
                      If(
                          varDashMaxStage > 0,
                          "<tr><td style='padding:20px 32px 6px 32px;font-size:11px;letter-spacing:2px;font-weight:700;color:#8C9BAE;'>FOLLOW-UP PROGRESS</td></tr>" &
                          "<tr><td style='padding:6px 32px 8px 32px;'>" &
                          "<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" &
                              Concat(
                                  colDashStage,
                                  "<tr>" &
                                      "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;font-weight:600;color:#0E1C2A;'>" & Label & "</td>" &
                                      "<td align='right' style='padding:10px 12px;border-top:1px solid #E3EAF1;font-weight:700;color:" & Switch(Key, "Fixed", "#1E7A50", "New", "#B26900", "#B03428") & ";' width='60'>" & N & "</td>" &
                                  "</tr>"
                              ) &
                          "</table></td></tr>",
                          ""
                      ) &
              
                      // coverage by stream
                      "<tr><td style='padding:20px 32px 6px 32px;font-size:11px;letter-spacing:2px;font-weight:700;color:#8C9BAE;'>COVERAGE BY STREAM</td></tr>" &
                      "<tr><td style='padding:6px 32px 8px 32px;'>" &
                      "<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" &
                          Concat(
                              colDashCov,
                              "<tr>" &
                                  "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;font-weight:600;color:#0E1C2A;'>" & Stream & "</td>" &
                                  "<td align='right' style='padding:10px 12px;border-top:1px solid #E3EAF1;color:#3A5068;'>" & Done & " of " & Total & " DTVs</td>" &
                                  "<td align='right' style='padding:10px 12px;border-top:1px solid #E3EAF1;font-weight:700;color:" & If(Done >= Total && Total > 0, "#1E7A50", "#1A5A99") & ";' width='60'>" & Text(If(Total > 0, Done / Total, 0), "0%") & "</td>" &
                              "</tr>"
                          ) &
                      "</table></td></tr>" &
              
                      // needs follow-up (newest 30)
                      If(
                          varDashFollowN > 0,
                          "<tr><td style='padding:20px 32px 6px 32px;font-size:11px;letter-spacing:2px;font-weight:700;color:#8C9BAE;'>NEEDS FOLLOW-UP</td></tr>" &
                          "<tr><td style='padding:6px 32px 8px 32px;'>" &
                          "<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" &
                              "<tr bgcolor='#F2F6FA' style='background-color:#F2F6FA;'>" &
                                  "<th align='left' style='padding:10px 12px;font-size:11px;letter-spacing:1px;color:#8C9BAE;border-bottom:2px solid #1A5A99;border-radius:14px 0 0 0;'>DTV</th>" &
                                  "<th align='left' style='padding:10px 12px;font-size:11px;letter-spacing:1px;color:#8C9BAE;border-bottom:2px solid #1A5A99;'>DATE</th>" &
                                  "<th align='left' style='padding:10px 12px;font-size:11px;letter-spacing:1px;color:#8C9BAE;border-bottom:2px solid #1A5A99;border-radius:0 14px 0 0;'>ISSUE</th>" &
                              "</tr>" &
                              Concat(
                                  FirstN(SortByColumns(Filter(colDash, Follow), "When", SortOrder.Descending), 30),
                                  "<tr>" &
                                      "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;'><b style='color:#0E1C2A;'>" & Dept & "</b><br><span style='font-size:12px;color:#8C9BAE;'>" & Loc & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Title & "</span></td>" &
                                      "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;color:#3A5068;white-space:nowrap;'>" & Text(When, "d mmm") & "</td>" &
                                      "<td style='padding:10px 12px;border-top:1px solid #E3EAF1;color:#B03428;font-weight:600;'>" & Fails & "</td>" &
                                  "</tr>"
                              ) &
                          "</table>" &
                          If(varDashFollowN > 30, "<div style='font-size:12px;color:#8C9BAE;padding-top:8px;'>+ " & (varDashFollowN - 30) & " more in the attached file.</div>", "") &
                          "</td></tr>",
                          ""
                      ) &
              
                      // sign-off
                      "<tr><td style='padding:20px 32px 28px 32px;font-size:15px;line-height:22px;color:#3A5068;'>Thanks,<br><b style='color:#0E1C2A;'>" & User().FullName & "</b></td></tr>" &
              
                      Substitute(EmailFoot, "{{NOTE}}", "This email and its attachment contain staff names. Please handle them in line with your privacy policy.")
                  );
                  // the flow sends it: Power Apps cannot attach a text file itself
                  If(
                      IsError(
                          DTVDashboardEmail.Run(
                              User().Email,
                              "DTV Audit Summary (" & varDashStreamLbl & ")",
                              varDashEmail,
                              "DTV_Audits_" & Text(Today(), "yyyy-mm-dd") & ".csv",
                              varDashCsv
                          )
                      ),
                      Notify("Could not send the email. Check your connection and try again.", NotificationType.Error),
                      Notify("Email sent to " & User().Email & ".", NotificationType.Success)
                  );
                  Set(varSaving, false)
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(11 * UI, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
