Screens:
  Dashboard:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =If(IsBlank(varDashStream), Set(varDashStream, "ALL"));
        If(IsBlank(varDashWhyKind), Set(varDashWhyKind, "Print"));
        Set(varDashFocus, "");
        Set(varDashWhyR, "");
        Set(varDashStage, "");
        Set(varSaving, false);
        Reset(txtSearch_Dsh);
        // stream pills: All, then one per stream (short name = text before the first "&" or ",")
        ClearCollect(colDashPills, { Label: "All Streams", Key: "ALL" });
        ForAll(
            Filter(Distinct(DTV_Register, Stream), !IsBlank(Value) && Value <> "All") As s,
            Collect(colDashPills, { Label: Trim(First(Split(Substitute(s.Value, ",", "&"), "&")).Value), Key: s.Value })
        );
        Select(btnLoad_Dsh)
    Children:
      - conRoot_Dsh:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Dsh:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Dsh:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Dsh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =Navigate(Home, ScreenTransition.UnCoverRight)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(24 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =DashX - Round(10 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Dsh:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(42 * UI, 0)
                        Size: =Round(19 * UI, 0)
                        Text: ="Audit Dashboard"
                        Width: =DashW - Round(55 * UI, 0) - If(DashWide, Round(250 * UI, 0), Round(80 * UI, 0))
                        Wrap: =false
                        X: =DashX + Round(55 * UI, 0)
                        Y: =Round(12 * UI, 0)
                  - lblHdrS_Dsh:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Font: =AppFont
                        Height: =Round(25 * UI, 0)
                        Size: =Round(12 * UI, 0)
                        Text: =If(varDashStream = "ALL", "All streams", varDashStream) & "  ·  " & varDashN & If(varDashN = 1, " DTV", " DTVs") & " audited  ·  latest audit each"
                        Width: =DashW - Round(55 * UI, 0) - If(DashWide, Round(250 * UI, 0), Round(80 * UI, 0))
                        Wrap: =false
                        X: =DashX + Round(55 * UI, 0)
                        Y: =Round(53 * UI, 0)
                  - conEmail_Dsh:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(255, 255, 255, 0.45)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 0.16)
                        Height: =Round(50 * UI, 0)
                        RadiusBottomLeft: =Round(25 * UI, 0)
                        RadiusBottomRight: =Round(25 * UI, 0)
                        RadiusTopLeft: =Round(25 * UI, 0)
                        RadiusTopRight: =Round(25 * UI, 0)
                        Width: =If(DashWide, Round(230 * UI, 0), Round(60 * UI, 0))
                        X: =DashX + DashW - If(DashWide, Round(230 * UI, 0), Round(60 * UI, 0))
                        Y: =Round(22 * UI, 0)
                      Children:
                        - btnEmail_Dsh:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Color: =C_White
                              DisplayMode: =If(varSaving || varDashN = 0, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Icon: ="Mail"
                              OnSelect: =Select(btnSend_Dsh)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Size: =Round(12 * UI, 0)
                              Text: =If(DashWide, If(varSaving, "Sending...", "Email Me the Data"), "")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width
            - conBody_Dsh:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Start
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =DashGap
                  LayoutMinHeight: =Round(250 * UI, 0)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =Round(10 * UI, 0)
                  PaddingLeft: =DashX
                  PaddingRight: =DashX
                  PaddingTop: =Round(18 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conFilters_Dsh:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(76 * UI, 0)
                        LayoutMinHeight: =Round(76 * UI, 0)
                        RadiusBottomLeft: =Round(20 * UI, 0)
                        RadiusBottomRight: =Round(20 * UI, 0)
                        RadiusTopLeft: =Round(20 * UI, 0)
                        RadiusTopRight: =Round(20 * UI, 0)
                        Width: =DashW
                      Children:
                        - galStream_Dsh:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              Height: =Round(52 * UI, 0)
                              Items: =colDashPills
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =(Parent.Width - Round(32 * UI, 0)) / Max(1, CountRows(colDashPills))
                              Width: =Parent.Width - Round(32 * UI, 0)
                              X: =Round(16 * UI, 0)
                              Y: =Round(12 * UI, 0)
                            Children:
                              - conStr_Dsh:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =If(ThisItem.Key = varDashStream, C_Accent, C_Line)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.Key = varDashStream, C_Accent, C_White)
                                    Height: =Round(48 * UI, 0)
                                    RadiusBottomLeft: =Round(24 * UI, 0)
                                    RadiusBottomRight: =Round(24 * UI, 0)
                                    RadiusTopLeft: =Round(24 * UI, 0)
                                    RadiusTopRight: =Round(24 * UI, 0)
                                    Width: =Parent.TemplateWidth - Round(6 * UI, 0)
                                    X: =3
                                    Y: =Round(2 * UI, 0)
                                  Children:
                                    - lblStr_Dsh:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =If(ThisItem.Key = varDashStream, C_White, C_Ink2)
                                          Font: =AppFont
                                          FontWeight: =FontWeight.Bold
                                          Height: =Round(48 * UI, 0)
                                          Size: =Round(11 * UI, 0)
                                          Text: =ThisItem.Label
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width - Round(8 * UI, 0)
                                          Wrap: =false
                                          X: =Round(4 * UI, 0)
                                    - btnStr_Dsh:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Appearance: =ButtonAppearance.Transparent
                                          BorderStyle: =BorderStyle.None
                                          FontWeight: =""
                                          Height: =Parent.Height
                                          OnSelect: |-
                                            =Set(varDashStream, ThisItem.Key);
                                            Select(btnCalc_Dsh)
                                          PaddingBottom: =5
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =5
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Text: =""
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width
                  - lblLoading_Dsh:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Color: =C_Muted
                        Font: =AppFont
                        Height: =Round(26 * UI, 0)
                        LayoutMinHeight: =Round(26 * UI, 0)
                        Size: =Round(12 * UI, 0)
                        Text: ="Loading audits..."
                        Visible: =varDashLoading
                        Width: =DashW
                        Wrap: =false
                  - conKpi_Dsh:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(DashWide, Round(112 * UI, 0), 3 * Round(112 * UI, 0) + 2 * DashGap)
                        LayoutMinHeight: =If(DashWide, Round(112 * UI, 0), 3 * Round(112 * UI, 0) + 2 * DashGap)
                        Width: =DashW
                      Children:
                        - conKAud_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(false, C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(false, C_AccentSoft, C_White)
                              Height: =Round(112 * UI, 0)
                              RadiusBottomLeft: =Round(20 * UI, 0)
                              RadiusBottomRight: =Round(20 * UI, 0)
                              RadiusTopLeft: =Round(20 * UI, 0)
                              RadiusTopRight: =Round(20 * UI, 0)
                              Width: =If(DashWide, (DashW - 4 * DashGap) / 5, (DashW - DashGap) / 2)
                              X: =If(DashWide, 0 * ((DashW - 4 * DashGap) / 5 + DashGap), 0 * ((DashW - DashGap) / 2 + DashGap))
                              Y: =If(DashWide, 0, 0 * (Round(112 * UI, 0) + DashGap))
                            Children:
                              - lblKAudC_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="DTVS AUDITED"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(14 * UI, 0)
                              - lblKAudV_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(46 * UI, 0)
                                    Size: =Round(28 * UI, 0)
                                    Text: =varDashN & " / " & varDashRegN
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(34 * UI, 0)
                              - lblKAudS_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =Text(If(varDashRegN > 0, varDashCovN / varDashRegN, 0), "0%") & " of the register"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(80 * UI, 0)
                              - btnKAud_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varDashFocus, "");
                                      Set(varDashWhyR, "");
                                      Set(varDashStage, "")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                        - conKCov_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(false, C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(false, C_AccentSoft, C_White)
                              Height: =Round(112 * UI, 0)
                              RadiusBottomLeft: =Round(20 * UI, 0)
                              RadiusBottomRight: =Round(20 * UI, 0)
                              RadiusTopLeft: =Round(20 * UI, 0)
                              RadiusTopRight: =Round(20 * UI, 0)
                              Width: =If(DashWide, (DashW - 4 * DashGap) / 5, (DashW - DashGap) / 2)
                              X: =If(DashWide, 1 * ((DashW - 4 * DashGap) / 5 + DashGap), 1 * ((DashW - DashGap) / 2 + DashGap))
                              Y: =If(DashWide, 0, 0 * (Round(112 * UI, 0) + DashGap))
                            Children:
                              - lblKCovC_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="NOT YET AUDITED"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(14 * UI, 0)
                              - lblKCovV_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Accent
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(46 * UI, 0)
                                    Size: =Round(28 * UI, 0)
                                    Text: =Max(0, varDashRegN - varDashCovN)
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(34 * UI, 0)
                              - lblKCovS_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="DTVs with no audit"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(80 * UI, 0)
                              - btnKCov_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varDashFocus, "");
                                      Set(varDashWhyR, "");
                                      Set(varDashStage, "")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                        - conKClr_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(varDashFocus = "Clear", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varDashFocus = "Clear", C_AccentSoft, C_White)
                              Height: =Round(112 * UI, 0)
                              RadiusBottomLeft: =Round(20 * UI, 0)
                              RadiusBottomRight: =Round(20 * UI, 0)
                              RadiusTopLeft: =Round(20 * UI, 0)
                              RadiusTopRight: =Round(20 * UI, 0)
                              Width: =If(DashWide, (DashW - 4 * DashGap) / 5, (DashW - DashGap) / 2)
                              X: =If(DashWide, 2 * ((DashW - 4 * DashGap) / 5 + DashGap), 0 * ((DashW - DashGap) / 2 + DashGap))
                              Y: =If(DashWide, 0, 1 * (Round(112 * UI, 0) + DashGap))
                            Children:
                              - lblKClrC_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="ALL CLEAR"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(14 * UI, 0)
                              - lblKClrV_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(30, 122, 80, 1)
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(46 * UI, 0)
                                    Size: =Round(28 * UI, 0)
                                    Text: =varDashClearN
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(34 * UI, 0)
                              - lblKClrS_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =Text(If(varDashN > 0, varDashClearN / varDashN, 0), "0%") & " of DTVs"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(80 * UI, 0)
                              - btnKClr_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varDashFocus, If(varDashFocus = "Clear", "", "Clear"));
                                      Set(varDashWhyR, "")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                        - conKFol_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(varDashFocus = "Follow", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varDashFocus = "Follow", C_AccentSoft, C_White)
                              Height: =Round(112 * UI, 0)
                              RadiusBottomLeft: =Round(20 * UI, 0)
                              RadiusBottomRight: =Round(20 * UI, 0)
                              RadiusTopLeft: =Round(20 * UI, 0)
                              RadiusTopRight: =Round(20 * UI, 0)
                              Width: =If(DashWide, (DashW - 4 * DashGap) / 5, (DashW - DashGap) / 2)
                              X: =If(DashWide, 3 * ((DashW - 4 * DashGap) / 5 + DashGap), 1 * ((DashW - DashGap) / 2 + DashGap))
                              Y: =If(DashWide, 0, 1 * (Round(112 * UI, 0) + DashGap))
                            Children:
                              - lblKFolC_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: ="NEED FOLLOW-UP"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(14 * UI, 0)
                              - lblKFolV_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(176, 52, 40, 1)
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(46 * UI, 0)
                                    Size: =Round(28 * UI, 0)
                                    Text: =varDashFollowN
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(34 * UI, 0)
                              - lblKFolS_Dsh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(20 * UI, 0)
                                    Size: =Round(11 * UI, 0)
                                    Text: =Text(If(varDashN > 0, varDashFollowN / varDashN, 0), "0%") & " of DTVs"
                                    Width: =Parent.Width - Round(36 * UI, 0)
                                    Wrap: =false
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(80 * UI, 0)
                              - btnKFol_Dsh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varDashFocus, If(varDashFocus = "Follow", "", "Follow"));
                                      Set(varDashWhyR, "")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                        - conKNf_Dsh:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(varDashFocus = "Found", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varDashFocus = "Found", C_AccentSoft, C_White)
                              Height: =Round(112 * UI, 0)
                              RadiusBottomLeft: =Round(20 * UI, 0)
                              RadiusBottomRight: =Round(20 * UI, 0)
                              RadiusTopLeft: =Round(20 * UI, 0)
                              RadiusTopRight: =Round(20 * UI, 0)
                              Width: =If(DashWide, (DashW - 4 * DashGap) / 5, (DashW - DashGap) / 2)
                              X: =If(DashWide, 4 * ((DashW - 4 * DashGap) / 5 + DashGap), 0 * ((DashW - DashGap) / 2 + DashGap))
                              Y: =If(DashWide, 0, 2 * (Round(112 * UI, 0) + DashGap))
