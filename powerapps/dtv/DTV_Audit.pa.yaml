Screens:
  Audit:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =Set(varFound, Blank());
        Set(varLogin, Blank());
        Set(varPList, Blank());
        Set(varFolder, Blank());
        Set(varLoginWhy, Blank());
        Set(varPrint, Blank());
        Set(varPrintWhy, Blank());
        Set(varList, Blank());
        Set(varMatch, Blank());
        Set(varSaving, false);
        Reset(txtNotes_LoginNo);
        Reset(txtNotes_PrintNo);
        Reset(txtMissing_Aud);
        Reset(txtExtra_Aud);
        Reset(txtNotes_Aud);
        Reset(txtSpoke_Aud);
        Reset(txtIssues_Aud);
        Reset(addPhoto_Aud);
        ClearCollect(colEdu, { Value: "" });
        Clear(colEdu)
    Children:
      - conRoot_Aud:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Aud:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Aud:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Aud:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =If(varReaudit, Navigate(ReAuditList, ScreenTransition.UnCoverRight), Navigate(SelectDTV, ScreenTransition.UnCoverRight))
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(24 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Aud:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(42 * UI, 0)
                        Size: =Round(19 * UI, 0)
                        Text: =If(varReaudit, "Re-audit", "Audit")
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(12 * UI, 0)
                  - lblHdrS_Aud:
