Screens:
  Home:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =Set(varStreamPick, Blank());
        // back on Home: the next audit is a normal audit unless Re-audit is chosen
        Set(varReaudit, false);
        // audit progress: DTVs with an audit in the last month
        Refresh(Audit_Results);
        ClearCollect(
            colRecentAudits,
            Distinct(Filter(Audit_Results, Created >= DateAdd(Now(), -1, TimeUnit.Months)), Title)
        );
        ClearCollect(colAllTags, DTV_Register);
        Set(varAllDTVs, CountRows(colAllTags));
        Set(varAllDone, CountRows(Filter(colAllTags, Title in colRecentAudits.Value)));
        Set(varMyDTVs, CountRows(Filter(colAllTags, !IsBlank(varStream) && (Stream = varStream || Stream = "All"))));
        Set(varMyDone, CountRows(Filter(colAllTags, !IsBlank(varStream) && (Stream = varStream || Stream = "All") && Title in colRecentAudits.Value)));
        // share done, worked out once (0 when the stream has no DTVs, so there is never a divide by zero)
        Set(varMyPct, If(varMyDTVs > 0, varMyDone / varMyDTVs, 0));
        Set(varAllPct, If(varAllDTVs > 0, varAllDone / varAllDTVs, 0))
    Children:
      - conRoot_Hm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Hm:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(165 * UI, 0)
                  LayoutMinHeight: =Round(165 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Hm:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - lblKicker_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(23 * UI, 0)
                        Size: =Round(11 * UI, 0)
                        Text: ="ieMR DOWNTIME VIEWER AUDIT"
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(33 * UI, 0)
                  - lblTitle_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(70 * UI, 0)
                        Size: =Round(28 * UI, 0)
                        Text: ="DTV Audit"
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(45 * UI, 0)
                  - lblHello_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.9)
                        Font: =AppFont
                        Height: =Round(28 * UI, 0)
                        Size: =Round(13 * UI, 0)
                        Text: |-
                          ="Hi " & With({ n: User().FullName }, If("," in n, Trim(Last(Split(n, ",")).Value), First(Split(n, " ")).Value)) & "  ·  " & Text(Today(), "dddd d mmmm")
